<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img"><title>Context and rule matching feeding one derivation</title><desc>Litex mechanically matches context and rule candidates. One blue Context pool selects a = 1; one green Rules pool selects Substitution and Calculation. Muted ellipses denote unspecified additional candidates, not asserted facts or measured counts. Both pools merge into one derivation: a + 2 = 3 rewrites to 1 + 2 = 3 and closes by calculating 3 = 3. Lean retains Elaboration, Proof and Kernel.</desc><rect width="1100" height="1100" fill="white"/><text x="18" y="35" xml:space="preserve" style="white-space:pre" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#25282B">a</text><circle cx="46" cy="65" r="5" fill="#0072B2"/><text x="63" y="79" xml:space="preserve" style="white-space:pre" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="600" text-anchor="start" fill="#25282B">Litex</text><circle cx="642" cy="65" r="5" fill="#D55E00"/><text x="659" y="79" xml:space="preserve" style="white-space:pre" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="600" text-anchor="start" fill="#25282B">Lean</text><rect x="40" y="112" width="560" height="163" rx="24" fill="#F8FAFB" stroke="#E2E8ED" stroke-width="1.6"/><rect x="636" y="112" width="424" height="176" rx="24" fill="#F8FAFB" stroke="#E2E8ED" stroke-width="1.6"/><g><text x="62" y="163" xml:space="preserve" style="white-space:pre" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="38" font-weight="400" text-anchor="start" fill="#25282B">let a = 1</text><text x="62" y="211" xml:space="preserve" style="white-space:pre" font-family="Menlo,DejaVu Sans Mono,monospace" font-size="38" font-weight="400" text-anchor="start" fill="#25282B">a + 2 = 3</text></g><g data-lean-source="full"><text x="652" y="154" xml:space="preserve" style="white-space:pre" font-family="Menlo,DejaVu 