name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608
  # Includes rust-clippy b84f31e: memoize every visited type in the
  # needless_collect analysis of recursive proof-result types.
  LITEX_CLIPPY_TOOLCHAIN: nightly-2026-10-25

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install Clippy toolchain
        run: rustup toolchain install "$LITEX_CLIPPY_TOOLCHAIN" --profile minimal --component clippy --no-self-update

      - name: Clippy
        run: cargo "+$LITEX_CLIPPY_TOOLCHAIN" clippy -- -A warnings

      - name: Core tests
        run: |
          cargo test --lib knowledge_base::
          cargo test --lib run_module::
          cargo test --lib rational_expression::
          cargo test --lib parse::
          cargo test --lib execute::exec_stmt_transaction_tests
