name: Deploy

on:
  workflow_dispatch:
  push:
    tags:
      # Release tags are the exact Cargo version, without a leading `v`.
      # Keep the filter broad enough for both stable and prerelease semver;
      # the validate job below enforces the exact package-version match.
      - "*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Validate tag
  # ─────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify standard library source
        run: |
          test -d std
          test -f std/basics/litex.config
          test -f std/basics/main.lit

      - name: Extract version from tag
        id: version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${VERSION%%+*}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Cargo.toml version matches tag
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$CARGO_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.version }} does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi

  quality:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Release preflight contract tests
        run: python3 .github/scripts/release/test_preflight.py

      - name: Release tests
        run: cargo test --release --all-targets --locked

  # ─────────────────────────────────────────────
  # Job 2: Build binaries for all platforms
  # ─────────────────────────────────────────────
  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.arch }}
    needs: [validate, quality]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            os_name: linux
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            os_name: linux
            arch: arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os_name: darwin
            arch: arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os_name: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build native release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Installed std CLI regression
        run: cargo test --release --locked --target ${{ matrix.target }} --test installed_std_cli

      - name: Rename binary (unix)
        if: matrix.os_name != 'windows'
        run: |
          cp target/${{ matrix.target }}/release/litex litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}

      - name: Package archive (unix)
        if: matrix.os_name != 'windows'
        run: |
          PKG_DIR="package_litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          mkdir -p "${PKG_DIR}"
          cp "litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}" "${PKG_DIR}/litex"
          python3 .github/scripts/release/package_std.py std "${PKG_DIR}/std"
          chmod 755 "${PKG_DIR}/litex"
          COPYFILE_DISABLE=1 tar -czf "litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" -C "${PKG_DIR}" .

      - name: Rename binary (windows)
        if: matrix.os_name == 'windows'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/litex.exe litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.exe

      - name: Package archive (windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $pkgDir = "package_litex_${env:VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item -Path "litex_${env:VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.exe" -Destination (Join-Path $pkgDir "litex.exe")
          python .github/scripts/release/package_std.py std (Join-Path $pkgDir 'std')
          if ($LASTEXITCODE -ne 0) { throw 'std packaging failed' }
          Compress-Archive -Path (Join-Path $pkgDir "*") -DestinationPath "litex_${env:VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.zip" -Force

      - name: Smoke test archive (native)
        if: matrix.os_name != 'windows'
        run: |
          python3 .github/scripts/release/preflight.py --archive \
            "litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" \
            --version "${VERSION}"

      - name: Smoke test archive (windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          python .github/scripts/release/preflight.py --archive "litex_${env:VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.zip" --version "${env:VERSION}"

      - name: Setup Homebrew for native installation checks
        if: matrix.os_name != 'windows'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      - name: Homebrew install and std declaration smoke
        if: matrix.os_name != 'windows'
        run: |
          python3 .github/scripts/release/package_manager_smoke.py --manager homebrew \
            --archive "litex_${VERSION}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" --version "${VERSION}"

      - name: Setup Scoop for native installation checks
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          $scoopRoot = Join-Path $env:RUNNER_TEMP 'litex-scoop'
          $installer = Join-Path $env:RUNNER_TEMP 'install-scoop.ps1'
          Invoke-RestMethod -Uri 'https://get.scoop.sh' -OutFile $installer
          Set-ExecutionPolicy -ExecutionPolicy Bypass -Scope Process -Force
          & $installer -RunAsAdmin -ScoopDir $scoopRoot
          if ($LASTEXITCODE -ne 0) { throw 'Scoop setup failed' }
          (Join-Path $scoopRoot 'shims') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SCOOP=$scoopRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Scoop install and std declaration smoke
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          python .github/scripts/release/package_manager_smoke.py --manager scoop --archive "litex_${env:VERSION}_windows_amd64.zip" --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Scoop installed std smoke failed' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_name }}-${{ matrix.arch }}
          path: litex_${{ env.VERSION }}_*

  # ─────────────────────────────────────────────
  # Job 3: Package .deb files
  # ─────────────────────────────────────────────
  package-deb:
    name: Package .deb (${{ matrix.arch }})
    needs: [validate, build]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            deb_arch: arm64
            runner: ubuntu-22.04-arm
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-${{ matrix.arch }}

      - name: Build .deb
        run: |
          PKG_DIR="pkg_litex_${VERSION}_${{ matrix.deb_arch }}"
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/local/bin"
          mkdir -p "${PKG_DIR}/usr/share/litex"

          sed -e "s/{{VERSION}}/${VERSION}/" \
              -e "s/{{ARCH}}/${{ matrix.deb_arch }}/" \
              dist/deb/control.template > "${PKG_DIR}/DEBIAN/control"

          cp "litex_${VERSION}_linux_${{ matrix.arch }}" "${PKG_DIR}/usr/local/bin/litex"
          python3 .github/scripts/release/package_std.py std "${PKG_DIR}/usr/share/litex/std"
          chmod 755 "${PKG_DIR}/usr/local/bin/litex"
          dpkg-deb --build "${PKG_DIR}" "litex_${VERSION}_${{ matrix.deb_arch }}.deb"

      - name: Smoke test .deb (native)
        run: |
          sudo dpkg -i "litex_${VERSION}_${{ matrix.deb_arch }}.deb"
          sudo python3 .github/scripts/release/preflight.py \
            --installed-binary /usr/local/bin/litex --std /usr/share/litex/std --version "${VERSION}"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: litex_${{ env.VERSION }}_${{ matrix.deb_arch }}.deb

  # ─────────────────────────────────────────────
  # Job 4: Package and verify .msi (Windows)
  # ─────────────────────────────────────────────
  package-msi:
    name: Package .msi
    needs: [validate, build]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Download Windows binary
        uses: actions/download-artifact@v4
        with:
          name: binary-windows-amd64

      - name: Install WiX 3.14.1
        shell: pwsh
        run: |
          $wixRoot = Join-Path $env:RUNNER_TEMP 'wix-3.14.1'
          $wixZip = Join-Path $env:RUNNER_TEMP 'wix-3.14.1.zip'
          Invoke-WebRequest -Uri 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile $wixZip
          Expand-Archive -Path $wixZip -DestinationPath $wixRoot
          $wixBin = Split-Path (Get-ChildItem -Path $wixRoot -Recurse -Filter candle.exe | Select-Object -First 1).FullName
          if (-not $wixBin) { throw 'WiX candle.exe was not found' }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked

      - name: Init WiX
        run: cargo wix init --force

      - name: Generate WiX std fragment
        shell: bash
        run: |
          python .github/scripts/release/generate_wix_std.py
          test -f wix/std.wxs
          grep -F 'Source="std\basics\litex.config"' wix/std.wxs
          grep -F 'ComponentGroup Id="LitexStd"' wix/std.wxs
          grep -F 'ComponentGroupRef Id="LitexStd"' wix/main.wxs

      - name: Build .msi
        shell: bash
        run: |
          WIX_VERSION=$(echo "${VERSION}" | sed 's/[-+].*//')
          mkdir -p target/release
          cp "litex_${VERSION}_windows_amd64.exe" target/release/litex.exe
          cargo wix --no-build --nocapture -o "litex_${VERSION}_amd64.msi" --install-version "${WIX_VERSION}"

      - name: Smoke test .msi
        shell: pwsh
        run: |
          $msi = "litex_${env:VERSION}_amd64.msi"
          $installRoot = Join-Path $env:ProgramFiles 'litex-lang'
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart', "APPLICATIONFOLDER=`"$installRoot`"") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
              throw "MSI installation failed with exit code $($install.ExitCode)"
          }
          $binary = Join-Path $installRoot 'bin\litex.exe'
          if (-not (Test-Path $binary)) {
            throw "MSI did not install the Litex binary at $binary"
          }
          python .github/scripts/release/preflight.py --installed-binary $binary --std (Join-Path $installRoot 'std') --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { throw "MSI installed std smoke failed" }

      - name: Upload .msi
        uses: actions/upload-artifact@v4
        with:
          name: msi
          path: litex_${{ env.VERSION }}_amd64.msi

  # ─────────────────────────────────────────────
  # Job 5: Create GitHub Release
  # ─────────────────────────────────────────────
  release:
    if: github.event_name == 'push'
    name: GitHub Release
    needs: [validate, build, package-deb, package-msi]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: true

      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: artifacts
          merge-multiple: true

      - name: Download .msi artifact
        uses: actions/download-artifact@v4
        with:
          name: msi
          path: artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: "Release of litex version ${{ env.VERSION }}"
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.deb
            artifacts/*.msi

  # ─────────────────────────────────────────────
  # Job 6: Publish to crates.io
  # ─────────────────────────────────────────────
  publish-crates-io:
    name: Publish to crates.io
    needs: [validate, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}

  # ─────────────────────────────────────────────
  # Job 7: Update Homebrew tap
  # ─────────────────────────────────────────────
  publish-homebrew:
    name: Update Homebrew tap
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download binaries for SHA256
        run: |
          BASE_URL="https://github.com/litexlang/golitex/releases/download/${VERSION}"
          for pair in "darwin_arm64" "linux_amd64" "linux_arm64"; do
            curl -fSL -o "litex_${VERSION}_${pair}.tar.gz" "${BASE_URL}/litex_${VERSION}_${pair}.tar.gz"
          done

      - name: Compute SHA256
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum litex_${VERSION}_darwin_arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum litex_${VERSION}_linux_amd64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum litex_${VERSION}_linux_arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: litexlang/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          cat > homebrew-tap/litex.rb << 'FORMULA'
          require "json"

          class Litex < Formula
            desc "A simple formal proof language and verifier"
            homepage "https://litexlang.com"
            version "VERSION_PLACEHOLDER"
            license "Apache-2.0"

            on_macos do
              url "https://github.com/litexlang/golitex/releases/download/VERSION_PLACEHOLDER/litex_VERSION_PLACEHOLDER_darwin_arm64.tar.gz"
              sha256 "SHA_DARWIN_ARM64"
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/litexlang/golitex/releases/download/VERSION_PLACEHOLDER/litex_VERSION_PLACEHOLDER_linux_arm64.tar.gz"
                sha256 "SHA_LINUX_ARM64"
              else
                url "https://github.com/litexlang/golitex/releases/download/VERSION_PLACEHOLDER/litex_VERSION_PLACEHOLDER_linux_amd64.tar.gz"
                sha256 "SHA_LINUX_AMD64"
              end
            end

            def install
              bin.install "litex"
              (bin/"std").install Dir["std/*"]
            end

            test do
              version_output = shell_output("#{bin}/litex -version")
              assert_equal "Litex #{version}\n", version_output
              (testpath/"litex.config").write "[import std]\nbasics\n[export]\ntest = \"./test.lit\"\n"
              (testpath/"test.lit").write "quot(-7, 3) = -3\n$dvd(12, 3)\n"
              ENV.delete("LITEX_STD_PATH")
              output = JSON.parse(shell_output("#{bin}/litex -lang en -strict -f #{testpath}/test.lit"))
              assert_equal "run", output.fetch("kind")
              assert_equal true, output.fetch("success")
              assert_nil output.fetch("session_error")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" homebrew-tap/litex.rb
          sed -i "s/SHA_DARWIN_ARM64/${{ steps.sha.outputs.darwin_arm64 }}/g" homebrew-tap/litex.rb
          sed -i "s/SHA_LINUX_AMD64/${{ steps.sha.outputs.linux_amd64 }}/g" homebrew-tap/litex.rb
          sed -i "s/SHA_LINUX_ARM64/${{ steps.sha.outputs.linux_arm64 }}/g" homebrew-tap/litex.rb

      - name: Push to homebrew-tap
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add litex.rb
          git diff --cached --quiet && echo "No changes" || git commit -m "Update litex to ${VERSION}"
          git push

  # ─────────────────────────────────────────────
  # Job 8: Update Scoop bucket
  # ─────────────────────────────────────────────
  publish-scoop:
    name: Update Scoop bucket
    needs: [validate, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download Windows package for SHA256
        run: |
          curl -fSL -o "litex.zip" \
            "https://github.com/litexlang/golitex/releases/download/${VERSION}/litex_${VERSION}_windows_amd64.zip"

      - name: Compute SHA256
        id: sha
        run: |
          echo "windows_amd64=$(sha256sum litex.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: litexlang/scoop-litex
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-litex

      - name: Update manifest
        run: |
          cat > scoop-litex/litex.json << EOF
          {
              "version": "${VERSION}",
              "description": "A simple formal proof language and verifier",
              "homepage": "https://litexlang.com",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "https://github.com/litexlang/golitex/releases/download/${VERSION}/litex_${VERSION}_windows_amd64.zip",
                      "hash": "${{ steps.sha.outputs.windows_amd64 }}"
                  }
              },
              "bin": [["litex.exe", "litex"]],
              "checkver": "github",
              "autoupdate": {
                  "architecture": {
                      "64bit": {
                          "url": "https://github.com/litexlang/golitex/releases/download/\$version/litex_\$version_windows_amd64.zip"
                      }
                  }
              }
          }
          EOF

      - name: Push to scoop bucket
        run: |
          cd scoop-litex
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add litex.json
          if ! git diff --cached --quiet; then
            git commit -m "Update litex to ${VERSION}"
          fi
          git push

  # ─────────────────────────────────────────────
  # Job 9: Build and push Docker image
  # ─────────────────────────────────────────────
  publish-docker:
    if: github.event_name == 'push'
    name: Publish Docker image
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binary-linux-*
          merge-multiple: true

      - name: Prepare Docker package context
        run: |
          CONTEXT="${RUNNER_TEMP}/litex-docker"
          mkdir -p "${CONTEXT}"
          cp Dockerfile "${CONTEXT}/Dockerfile"
          cp "litex_${VERSION}_linux_amd64" "${CONTEXT}/litex-amd64"
          cp "litex_${VERSION}_linux_arm64" "${CONTEXT}/litex-arm64"
          chmod +x "${CONTEXT}/litex-amd64" "${CONTEXT}/litex-arm64"
          python3 .github/scripts/release/package_std.py std "${CONTEXT}/std"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tags
        id: tags
        run: |
          TAGS="ghcr.io/litexlang/litex:${VERSION}"
          if [ "$PRERELEASE" = "false" ]; then
            TAGS="${TAGS},ghcr.io/litexlang/litex:latest"
          else
            TAGS="${TAGS},ghcr.io/litexlang/litex:beta"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/litex-docker
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}

      - name: Smoke test Docker image
        run: |
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -f "${SMOKE_DIR}/smoke.lit" "${SMOKE_DIR}/litex.config"; rmdir "${SMOKE_DIR}"' EXIT
          printf '%s\n' '[import std]' 'basics' '[export]' 'smoke = "./smoke.lit"' > "${SMOKE_DIR}/litex.config"
          printf '%s\n' 'quot(-7, 3) = -3' '$dvd(12, 3)' > "${SMOKE_DIR}/smoke.lit"
          if ! OUTPUT=$(docker run --rm -v "${SMOKE_DIR}:/work:ro" -w /work "ghcr.io/litexlang/litex:${VERSION}" -lang en -f smoke.lit); then
            printf '%s\n' "${OUTPUT}"
            exit 1
          fi
          if ! printf '%s\n' "${OUTPUT}" | python3 -c 'import json, sys; r = json.load(sys.stdin); assert r["kind"] == "run" and r["success"] is True and r["session_error"] is None'; then
            printf '%s\n' "${OUTPUT}"
            exit 1
          fi

  # ─────────────────────────────────────────────
  # Job 10: Deploy .deb to litexlang.com web server
  # ─────────────────────────────────────────────
  deploy-web-server:
    name: Deploy .deb to web server
    needs: [validate, package-deb, release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download amd64 .deb
        run: |
          curl -fSL -o "litex.deb" \
            "https://github.com/litexlang/golitex/releases/download/${VERSION}/litex_${VERSION}_amd64.deb"

      - name: Upload amd64 .deb to litexlang.com
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WEB_DEPLOY_HOST }}
          username: ${{ secrets.WEB_DEPLOY_USER }}
          key: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.WEB_DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.WEB_DEPLOY_PORT }}
          source: litex.deb
          target: /tmp/

      - name: Install amd64 .deb on litexlang.com
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.WEB_DEPLOY_HOST }}
          username: ${{ secrets.WEB_DEPLOY_USER }}
          key: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.WEB_DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.WEB_DEPLOY_PORT }}
          script: |
            set -e
            sudo dpkg -i /tmp/litex.deb
            rm -f /tmp/litex.deb
            litex -version
            SMOKE_DIR="$(mktemp -d)"
            trap 'rm -f "${SMOKE_DIR}/smoke.lit" "${SMOKE_DIR}/litex.config"; rmdir "${SMOKE_DIR}"' EXIT
            printf '%s\n' '[import std]' 'basics' '[export]' 'smoke = "./smoke.lit"' > "${SMOKE_DIR}/litex.config"
            printf '%s\n' 'quot(-7, 3) = -3' '$dvd(12, 3)' > "${SMOKE_DIR}/smoke.lit"
            cd "${SMOKE_DIR}"
            if ! OUTPUT=$(LITEX_STD_PATH=/usr/share/litex/std litex -lang en -f smoke.lit); then
              printf '%s\n' "${OUTPUT}"
              exit 1
            fi
            if ! printf '%s\n' "${OUTPUT}" | python3 -c 'import json, sys; r = json.load(sys.stdin); assert r["kind"] == "run" and r["success"] is True and r["session_error"] is None'; then
              printf '%s\n' "${OUTPUT}"
              exit 1
            fi
