name: Litex test suites

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Litex suite to run"
        required: true
        default: smoke_cli
        type: choice
        options:
          - smoke_cli
          - lib_core

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 8388608

jobs:
  examples:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Run selected suite
        run: |
          case "${{ inputs.suite }}" in
            smoke_cli)
              cargo build --release --locked
              OUTPUT=$(./target/release/litex -lang en -e '1 = 1')
              printf '%s\n' "${OUTPUT}" | python3 .github/scripts/release/preflight.py --assert-run-json
              OUTPUT=$(./target/release/litex -lang en -f examples/knowledge_base/def_prop/is_pos.lit)
              printf '%s\n' "${OUTPUT}" | python3 .github/scripts/release/preflight.py --assert-run-json
              ;;
            lib_core)
              cargo test --release --lib knowledge_base:: --locked
              cargo test --release --lib run_module:: --locked
              ;;
            *)
              echo "::error::unknown suite: ${{ inputs.suite }}"
              exit 1
              ;;
          esac
