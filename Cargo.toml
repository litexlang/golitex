[package]
name = "litex-lang"
version = "0.9.116-beta"
edition = "2021"
description = "The Language Where Mathematics Verifies Itself"
license = "Apache-2.0"
repository = "https://github.com/litexlang/golitex"
homepage = "https://litexlang.com"
authors = ["Jiachen Shen"]
keywords = ["proof", "formal-verification", "theorem-prover", "mathematics"]
categories = ["command-line-utilities", "mathematics", "science"]
readme = "README.md"
exclude = [
    "litex/.binary/*",
    "assets/*",
    "examples/*",
    "doc/*",
    ".github/*",
]

[lib]
name = "litex"

[[bin]]
name = "litex"
path = "src/main.rs"

[[bin]]
name = "stmt_result_to_lean_compiler"
path = "src/stmt_result_to_lean_compiler/main.rs"

[[test]]
name = "stmt_result_to_lean_compiler_tracers"
path = "tests/stmt_result_to_lean_compiler_tracers.rs"

[dependencies]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
