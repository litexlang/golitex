[package]
name = "litex-lang"
version = "0.9.116-beta"
edition = "2021"
description = "The Language Where Mathematics Verifies Itself"
license = "Apache-2.0"
repository = "https://github.com/litexlang/golitex"
homepage = "https://litexlang.com"
authors = ["Jiachen Shen"]
keywords = ["proof", "formal-verification", "theorem-prover", "mathematics"]
categories = ["command-line-utilities", "mathematics", "science"]
readme = "README.md"
exclude = [
    "litex/.binary/*",
    "assets/*",
    "examples/*",
    "doc/*",
    ".github/*",
]

[lib]
name = "litex"

[[bin]]
name = "litex"
path = "src/main.rs"

[[bin]]
name = "stmt_result_to_lean_compiler"
path = "src/bin/stmt_result_to_lean_compiler.rs"

[[test]]
name = "error_output_modes"
path = "tests/integration/error_output_modes.rs"

[[test]]
name = "examples_publication"
path = "tests/integration/examples_publication.rs"

[[test]]
name = "inference_reentrancy"
path = "tests/integration/inference_reentrancy.rs"

[[test]]
name = "module_local_drafts"
path = "tests/integration/module_local_drafts.rs"

[[test]]
name = "public_api"
path = "tests/integration/public_api.rs"

[[test]]
name = "retired_cli_commands"
path = "tests/integration/retired_cli_commands.rs"

[[test]]
name = "result_json_v2"
path = "tests/integration/result_json_v2.rs"

[[test]]
name = "showcases"
path = "tests/integration/showcases.rs"

[[test]]
name = "source_architecture"
path = "tests/integration/source_architecture.rs"

[[test]]
name = "source_readmes"
path = "tests/integration/source_readmes.rs"

[[test]]
name = "stmt_result_to_lean_compiler_cli"
path = "tests/integration/stmt_result_to_lean_compiler_cli.rs"

[[test]]
name = "stmt_result_to_lean_compiler_tracers"
path = "tests/integration/stmt_result_to_lean_compiler_tracers.rs"

[[test]]
name = "stmt_result_to_lean_markdown_code_blocks_cli"
path = "tests/integration/stmt_result_to_lean_markdown_code_blocks_cli.rs"

[dependencies]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
