[package]
name = "litex-lang"
version = "1.0.4-beta"
edition = "2021"
description = "The Language Where Mathematics Verifies Itself"
license = "Apache-2.0"
repository = "https://github.com/litexlang/golitex"
homepage = "https://litexlang.com"
authors = ["Jiachen Shen"]
keywords = ["proof", "formal-verification", "theorem-prover", "mathematics"]
categories = ["command-line-utilities", "mathematics", "science"]
readme = "README.md"
exclude = [
    "litex/.binary/*",
    "assets/*",
    "examples/*",
    "showcases/*",
    "scripts/*",
    "lean/.lake",
    "litex_semantics_in_lean/*",
    "**/.draft/**",
    "**/.drafts/**",
    "doc/*",
    ".github/*",
]

[lib]
name = "litex"

[[bin]]
name = "litex"
path = "src/main.rs"

[[test]]
name = "test_statements"
path = "tests/integration/test_statements.rs"

[[test]]
name = "cli_feedback"
path = "tests/integration/cli_feedback.rs"

[dependencies]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
strip = "symbols"
