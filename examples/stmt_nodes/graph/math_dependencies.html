function clipped(s,length){return String(s??'').length>length?String(s).slice(0,length-1)+'…':String(s??'');}
function render(){const svg=document.getElementById('graph');svg.replaceChildren();if(!data){svg.setAttribute('width','100%');svg.setAttribute('height','300');svg.append(elem('text',{x:40,y:80,fill:'#718170'},W.empty));return;}const query=document.getElementById('search').value.trim().toLowerCase();let nodes=data.nodes.filter(n=>(document.getElementById('inferred').checked||!n.inferred)&&(document.getElementById('local').checked||!n.scope.startsWith('local:')));if(query){const matches=new Set(nodes.filter(n=>(n.label+' '+n.statement).toLowerCase().includes(query)).map(n=>n.id));const neighbors=new Set(matches);for(const e of data.edges){if(matches.has(e.from))neighbors.add(e.to);if(matches.has(e.to))neighbors.add(e.from);}nodes=nodes.filter(n=>neighbors.has(n.id));}const ids=new Set(nodes.map(n=>n.id));const edges=data.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));const rank=new Map(nodes.map(n=>[n.id,0]));const incoming=new Map(nodes.map(n=>[n.id,0]));for(const e of edges)incoming.set(e.to,incoming.get(e.to)+1);const queue=nodes.filter(n=>incoming.get(n.id)===0).map(n=>n.id);const visited=new Set();for(let i=0;i<queue.length;i++){const id=queue[i];visited.add(id);for(const e of edges.filter(e=>e.from===id)){rank.set(e.to,Math.max(rank.get(e.to),rank.get(id)+1));incoming.set(e.to,incoming.get(e.to)-1);if(incoming.get(e.to)===0)queue.push(e.to);}}for(const n of nodes)if(!visited.has(n.id))rank.set(n.id,0);const rows=new Map(),position=new Map();let height=360,width=900;for(const n of nodes){const r=rank.get(n.id),row=rows.get(r)||0;rows.set(r,row+1);const p={x:40+r*330,y:45+row*130};position.set(n.id,p);width=Math.max(width,p.x+310);height=Math.max(height,p.y+140);}svg.setAttribute('width',width);svg.setAttribute('height',height);const defs=elem('defs');const marker=elem('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(elem('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#9daf9f'}));defs.append(marker);svg.append(defs);const seen=new Set();for(const e of edges){const pair=e.from+'|'+e.to+'|'+e.kind;if(seen.has(pair))continue;seen.add(pair);const a=position.get(e.from),b=position.get(e.to),x=a.x+265,y=a.y+44,tx=b.x,ty=b.y+44;const d=`M${x},${y} C${x+50},${y} ${tx-50},${ty} ${tx},${ty}`;const path=elem('path',{d,class:'edge','marker-end':'url(#arrow)'});path.append(elem('title',{},W.edge[e.kind]||e.kind));path.addEventListener('click',()=>edgeDetails(e));svg.append(path);const label=elem('text',{x:(x+tx)/2,y:(y+ty)/2-8,'text-anchor':'middle',class:'edge-label'},W.edge[e.kind]||e.kind);label.addEventListener('click',()=>edgeDetails(e));svg.append(label);}for(const n of nodes){const p=position.get(n.id),g=elem('g',{transform:`translate(${p.x} ${p.y})`,class:'node'+(n.id===selected?' selected':''),tabindex:0,role:'button','aria-label':n.label});g.append(elem('rect',{width:265,height:90,rx:12}));g.append(elem('rect',{x:0,y:18,width:4,height:54,rx:2,style:`fill:${colors[n.kind]};stroke:none;filter:none`}));g.append(elem('text',{x:18,y:23,class:'kind',fill:colors[n.kind]},W[n.kind]));g.append(elem('text',{x:18,y:46,class:'title'},clipped(n.label.split('\n')[0],29)));const text=n.kind==='fact'?n.label.split('\n').slice(1).join(' '):(n.statement.includes('\n')?n.statement.split('\n').slice(1,3).map(s=>s.trim()).join(' '):n.statement);g.append(elem('text',{x:18,y:66,class:'subtitle'},clipped(text,37)));if(['trusted','axiom','foundation','assumption','external'].includes(n.origin)||!n.published)g.append(elem('text',{x:18,y:82,class:'badge'},clipped(W.origin[n.origin]||n.origin,35)));g.append(elem('title',{},n.statement));g.addEventListener('click',()=>{selected=n.id;render();nodeDetails(n);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selected=n.id;render();nodeDetails(n);}});svg.append(g);}document.getElementById('summary').textContent=['definition','thm','fact'].map(k=>`${nodes.filter(n=>n.kind===k).length} ${W[k]}`).join(' · ');}
function text(tag,value){const e=document.createElement(tag);e.textContent=value;return e;}
function related(panel,title,edges,direction){if(!edges.length)return;panel.append(text('h3',title));const added=new Set();for(const e of edges){const id=e[direction];if(added.has(id))continue;added.add(id);const node=byId.get(id);const button=text('button',node.label);button.addEventListener('click',()=>{selected=id;nodeDetails(node);render();});panel.append(button);}}
function nodeDetails(n){const panel=document.getElementById('details');panel.replaceChildren(text('p',W[n.kind]+' · '+(W.origin[n.origin]||n.origin)),text('h2',n.label),text('h3',W.content),text('pre',n.statement));panel.append(text('h3',W.source),text('p',n.source+(n.line?':'+n.line:'')+(n.scope.startsWith('local:')?' · '+W.local:'')));related(panel,W.incoming,data.edges.filter(e=>e.to===n.id),'from');related(panel,W.outgoing,data.edges.filter(e=>e.from===n.id),'to');}
function edgeDetails(e){const panel=document.getElementById('details');panel.replaceChildren(text('p',W.edge[e.kind]||e.kind),text('h2',byId.get(e.from).label+' → '+byId.get(e.to).label));const group=data.edges.filter(x=>x.dependency_group===e.dependency_group&&x.to===e.to);related(panel,W.incoming,group,'from');panel.append(text('h3',W.source),text('p',e.source));const details=document.createElement('details');details.append(text('summary',W.code),text('pre',e.statement));panel.append(details);}
document.getElementById('file').addEventListener('change',async e=>{try{load(JSON.parse(await e.target.files[0].text()));}catch(error){document.getElementById('notice').style.display='block';document.getElementById('notice').textContent=error.message;}});
for(const id of ['search','inferred','local'])document.getElementById(id).addEventListener('input',render);
document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',async e=>{e.preventDefault();if(e.dataTransfer.files.length){try{load(JSON.parse(await e.dataTransfer.files[0].text()));}catch(error){document.getElementById('notice').style.display='block';document.getElementById('notice').textContent=error.message;}}});
const initial=JSON.parse(document.getElementById('initial-data').textContent);if(initial)load(initial);else render();
</script>
