</style><defs><marker id="arrow-zh-c" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#007C91" /></marker></defs><rect width="1200" height="944" fill="white" /><text x="24" y="34" text-anchor="start" dominant-baseline="middle" class="title">从已验证的证据，到 Lean 证明</text><text x="24" y="67" text-anchor="start" dominant-baseline="middle" class="small">保留原始数学对象、构造条件，以及 Litex 实际选中的证明路线。</text><g data-node="flow-source" data-step="0" class="node "><title>Litex 源码</title><rect x="24" y="103" width="148" height="70" rx="3" class="shape" /><text x="36" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Litex 源码</text></g><g data-node="flow-runtime" data-step="1" class="node "><title>执行并验证</title><rect x="200" y="103" width="155" height="70" rx="3" class="shape" /><text x="212" y="127" text-anchor="start" dominant-baseline="middle" class="heading">执行并验证</text><text x="212" y="152" text-anchor="start" dominant-baseline="middle" class="small">完成本次 Runtime 执行</text></g><g data-node="flow-typed" data-step="2" class="node evidence"><title>结构化执行结果</title><rect x="383" y="103" width="175" height="70" rx="3" class="shape" /><text x="395" y="127" text-anchor="start" dominant-baseline="middle" class="heading">结构化执行结果</text><text x="395" y="152" text-anchor="start" dominant-baseline="middle" class="small">良定义 · 规则 · 引用</text></g><g data-node="flow-compiler" data-step="5" class="node "><title>证据重放编译器</title><rect x="586" y="103" width="150" height="70" rx="3" class="shape" /><text x="598" y="127" text-anchor="start" dominant-baseline="middle" class="heading">证据重放编译器</text><text x="598" y="152" text-anchor="start" dominant-baseline="middle" class="small">重放已记录的分支</text></g><g data-node="flow-generated" data-step="5" class="node evidence"><title>生成 Lean 代码</title><rect x="764" y="103" width="175" height="70" rx="3" class="shape" /><text x="776" y="127" text-anchor="start" dominant-baseline="middle" class="heading">生成 Lean 代码</text><text x="776" y="152" text-anchor="start" dominant-baseline="middle" class="small">import Litex</text></g><g data-node="flow-kernel" data-step="7" class="node evidence"><title>Lean 检查</title><rect x="967" y="103" width="209" height="70" rx="3" class="shape" /><text x="979" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Lean 检查</text><text x="979" y="152" text-anchor="start" dominant-baseline="middle" class="small">展开证明项 → 内核检查</text></g><path d="M 172 138 H 195" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 355 138 H 378" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 558 138 H 581" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 736 138 H 759" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 939 138 H 962" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 471 174 V 201" class="view" marker-end="url(#arrow-zh-c)" /><g data-node="json" data-step="2" class="node "><title>Detailed JSON</title><rect x="383" y="207" width="175" height="61" rx="3" class="shape" /><text x="395" y="227" text-anchor="start" dominant-baseline="middle" class="">Detailed JSON</text><text x="395" y="250" text-anchor="start" dominant-baseline="middle" class="small">查看同一份证据</text></g><path d="M 278 174 V 230 H 366 V 188 H 660 V 176" class="view" marker-end="url(#arrow-zh-c)" /><text x="680" y="203" text-anchor="start" dominant-baseline="middle" class="small">已完成的 Runtime：解析被引用的准确事实 ID</text><text x="24" y="299" text-anchor="start" dominant-baseline="middle" class="small">JSON 是结果的可读展示；当前编译器直接消费结构化结果与 Runtime。</text><line x1="24" y1="323" x2="1176" y2="323" class="guide" /><g transform="translate(24 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">a</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">读出已检查的依据</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">真实源码与 Detailed 字段</text><g data-node="source" data-step="0" class="node "><title>forall a C:</title><rect x="0" y="60" width="352" height="78" rx="3" class="shape" /><text x="12" y="84" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">forall a C:</text><text x="12" y="109" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">    a + 0 = a</text></g><g data-node="membership" data-step="2" class="node evidence"><title>引入一个复数成员</title><rect x="0" y="160" width="352" height="57" rx="3" class="shape" /><text x="12" y="178" text-anchor="start" dominant-baseline="middle" class="">引入一个复数成员</text><text x="12" y="200" text-anchor="start" dominant-baseline="middle" class="small">a ∈ ℂ，记录为 f15</text></g><g data-node="construction" data-step="3" class="node evidence"><title>检查加法的构造条件</title><rect x="0" y="239" width="352" height="57" rx="3" class="shape" /><text x="12" y="257" text-anchor="start" dominant-baseline="middle" class="">检查加法的构造条件</text><text x="12" y="279" text-anchor="start" dominant-baseline="middle" class="small">a ∈ ℂ、0 ∈ ℂ 使 a + 0 合法</text></g><g data-node="rule" data-step="4" class="node rule"><title>实际选中的等式证明</title><rect x="0" y="318" width="352" height="106" rx="3" class="shape" /><text x="12" y="336" text-anchor="start" dominant-baseline="middle" class="">实际选中的等式证明</text><text x="12" y="361" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">"searched_proof": {</text><text x="12" y="379" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "type": "builtin_rule",</text><text x="12" y="397" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "rule": "Calculation",</text><text x="12" y="415" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "mode": "rational" }</text></g><path d="M 176 138 V 157" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 176 217 V 236" class="arrow" marker-end="url(#arrow-zh-c)" /><path d="M 176 296 V 315" class="arrow" marker-end="url(#arrow-zh-c)" /><text x="176" y="447" text-anchor="middle" dominant-baseline="middle" class="small">局部 f1 → 全称 f2</text></g><g transform="translate(424 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">b</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">重放选中的证明路线</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">已记录的证据 → 实际生成的代码</text><g data-node="map-membership" data-step="2" class="node evidence"><title>成员关系引用 f15</title><rect x="0" y="60" width="352" height="69" rx="3" class="shape" /><text x="12" y="79" text-anchor="start" dominant-baseline="middle" class="">成员关系引用 f15</text><text x="12" y="103" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">h_15 : Litex.In … Litex.C</text></g><g data-node="map-construction" data-step="3" class="node evidence"><title>加法的良定义证据</title><rect x="0" y="151" width="352" height="81" rx="3" class="shape" /><text x="12" y="170" text-anchor="start" dominant-baseline="middle" class="">加法的良定义证据</text><text x="12" y="194" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Litex.add … h_15</text><text x="12" y="211" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  (Litex.numberInC …)</text></g><g data-node="map-rule" data-step="4" class="node rule"><title>Calculation / rational</title><rect x="0" y="254" width="352" height="94" rx="3" class="shape" /><text x="12" y="273" text-anchor="start" dominant-baseline="middle" class="">Calculation / rational</text><text x="12" y="297" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Litex.NativeBridge.</text><text x="12" y="314" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  sameOfDenoteNumber …</text><text x="12" y="331" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  (by ring!)</text></g><g data-node="generated" data-step="5" class="node evidence"><title>存储 f1 / 导出 f2</title><rect x="0" y="370" width="352" height="69" rx="3" class="shape" /><text x="12" y="389" text-anchor="start" dominant-baseline="middle" class="">存储 f1 / 导出 f2</text><text x="12" y="413" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">have h_1 … / theorem h_2 …</text></g><text x="0" y="470" text-anchor="start" dominant-baseline="middle" class="small">在选中的适配分支内，用固定归一化检查。</text><text x="0" y="490" text-anchor="start" dominant-baseline="middle" class="small">编译器沿着记录的路线生成证明。</text></g><g transform="translate(824 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">c</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">Litex.lean 提供什么</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">Lean 中的数学含义与已证明的桥接</text><g data-node="objects" data-step="6" class="node evidence"><title>1  对象保留构造条件</title><rect x="0" y="60" width="352" height="94" rx="3" class="shape" /><text x="12" y="81" text-anchor="start" dominant-baseline="middle" class="">1  对象保留构造条件</text><text x="12" y="107" text-anchor="start" dominant-baseline="middle" class="small">Obj α = 对象值 + WD 良定义证据</text><text x="12" y="132" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Representation M α · denote</text></g><g data-node="meaning" data-step="6" class="node evidence"><title>2  给事实明确的数学含义</title><rect x="0" y="178" width="352" height="94" rx="3" class="shape" /><text x="12" y="199" text-anchor="start" dominant-baseline="middle" class="">2  给事实明确的数学含义</text><text x="12" y="225" text-anchor="start" dominant-baseline="middle" class="small">In 表示成员关系；Same 表示含义相等</text><text x="12" y="250" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Semantics · In · Same</text></g><g data-node="bridges" data-step="6" class="node rule"><title>3  桥接规律本身也由 Lean 证明</title><rect x="0" y="296" width="352" height="107" rx="3" class="shape" /><text x="12" y="317" text-anchor="start" dominant-baseline="middle" class="">3  桥接规律本身也由 Lean 证明</text><text x="12" y="344" text-anchor="start" dominant-baseline="middle" class="small">数值等式 + 两端的含义证据 → Same</text><text x="12" y="373" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">NativeBridge.sameOfDenoteNumber</text></g><text x="0" y="436" text-anchor="start" dominant-baseline="middle" class="small">解释参数 M : Semantics 显式保留。</text><text x="0" y="457" text-anchor="start" dominant-baseline="middle" class="small">生成定理以该解释满足的规律为条件。</text><text x="0" y="490" text-anchor="start" dominant-baseline="middle" class="small">import Litex 引入这些定义和已证明的规律。</text></g><line x1="24" y1="872" x2="1176" y2="872" class="guide" /><text x="24" y="899" text-anchor="start" dominant-baseline="middle" class="heading">已证明的语义库 + 生成的证明项 → Lean 独立检查的定理</text><text x="24" y="925" text-anchor="start" dominant-baseline="middle" class="small">可选下一步：手写 Adapter → 普通 Lean / Mathlib 接口。</text></svg>
