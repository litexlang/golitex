</style><defs><marker id="arrow-en-c" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 7 3.5 L 0 7 Z" fill="#007C91" /></marker></defs><rect width="1200" height="944" fill="white" /><text x="24" y="34" text-anchor="start" dominant-baseline="middle" class="title">From checked evidence to a Lean proof</text><text x="24" y="67" text-anchor="start" dominant-baseline="middle" class="small">Preserve the source objects, construction conditions and selected proof route.</text><g data-node="flow-source" data-step="0" class="node "><title>Litex source</title><rect x="24" y="103" width="148" height="70" rx="3" class="shape" /><text x="36" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Litex source</text></g><g data-node="flow-runtime" data-step="1" class="node "><title>Execute + verify</title><rect x="200" y="103" width="155" height="70" rx="3" class="shape" /><text x="212" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Execute + verify</text><text x="212" y="152" text-anchor="start" dominant-baseline="middle" class="small">completed Runtime</text></g><g data-node="flow-typed" data-step="2" class="node evidence"><title>Typed results</title><rect x="383" y="103" width="175" height="70" rx="3" class="shape" /><text x="395" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Typed results</text><text x="395" y="152" text-anchor="start" dominant-baseline="middle" class="small">WD · rules · citations</text></g><g data-node="flow-compiler" data-step="5" class="node "><title>Replay compiler</title><rect x="586" y="103" width="150" height="70" rx="3" class="shape" /><text x="598" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Replay compiler</text><text x="598" y="152" text-anchor="start" dominant-baseline="middle" class="small">replay each branch</text></g><g data-node="flow-generated" data-step="5" class="node evidence"><title>Generated Lean</title><rect x="764" y="103" width="175" height="70" rx="3" class="shape" /><text x="776" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Generated Lean</text><text x="776" y="152" text-anchor="start" dominant-baseline="middle" class="small">import Litex</text></g><g data-node="flow-kernel" data-step="7" class="node evidence"><title>Lean checker</title><rect x="967" y="103" width="209" height="70" rx="3" class="shape" /><text x="979" y="127" text-anchor="start" dominant-baseline="middle" class="heading">Lean checker</text><text x="979" y="152" text-anchor="start" dominant-baseline="middle" class="small">elaborate → kernel check</text></g><path d="M 172 138 H 195" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 355 138 H 378" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 558 138 H 581" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 736 138 H 759" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 939 138 H 962" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 471 174 V 201" class="view" marker-end="url(#arrow-en-c)" /><g data-node="json" data-step="2" class="node "><title>Detailed JSON</title><rect x="383" y="207" width="175" height="61" rx="3" class="shape" /><text x="395" y="227" text-anchor="start" dominant-baseline="middle" class="">Detailed JSON</text><text x="395" y="250" text-anchor="start" dominant-baseline="middle" class="small">inspect the same evidence</text></g><path d="M 278 174 V 230 H 366 V 188 H 660 V 176" class="view" marker-end="url(#arrow-en-c)" /><text x="680" y="203" text-anchor="start" dominant-baseline="middle" class="small">Completed Runtime: resolve exact cited IDs</text><text x="24" y="299" text-anchor="start" dominant-baseline="middle" class="small">JSON is a view of the results. The current compiler consumes typed results + Runtime.</text><line x1="24" y1="323" x2="1176" y2="323" class="guide" /><g transform="translate(24 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">a</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">Inspect the evidence</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">Actual source and Detailed fields</text><g data-node="source" data-step="0" class="node "><title>forall a C:</title><rect x="0" y="60" width="352" height="78" rx="3" class="shape" /><text x="12" y="84" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">forall a C:</text><text x="12" y="109" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">    a + 0 = a</text></g><g data-node="membership" data-step="2" class="node evidence"><title>Introduce a complex member</title><rect x="0" y="160" width="352" height="57" rx="3" class="shape" /><text x="12" y="178" text-anchor="start" dominant-baseline="middle" class="">Introduce a complex member</text><text x="12" y="200" text-anchor="start" dominant-baseline="middle" class="small">a ∈ ℂ, stored as f15</text></g><g data-node="construction" data-step="3" class="node evidence"><title>Check the addition</title><rect x="0" y="239" width="352" height="57" rx="3" class="shape" /><text x="12" y="257" text-anchor="start" dominant-baseline="middle" class="">Check the addition</text><text x="12" y="279" text-anchor="start" dominant-baseline="middle" class="small">a ∈ ℂ and 0 ∈ ℂ certify a + 0</text></g><g data-node="rule" data-step="4" class="node rule"><title>Selected equality proof</title><rect x="0" y="318" width="352" height="106" rx="3" class="shape" /><text x="12" y="336" text-anchor="start" dominant-baseline="middle" class="">Selected equality proof</text><text x="12" y="361" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">"searched_proof": {</text><text x="12" y="379" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "type": "builtin_rule",</text><text x="12" y="397" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "rule": "Calculation",</text><text x="12" y="415" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  "mode": "rational" }</text></g><path d="M 176 138 V 157" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 176 217 V 236" class="arrow" marker-end="url(#arrow-en-c)" /><path d="M 176 296 V 315" class="arrow" marker-end="url(#arrow-en-c)" /><text x="176" y="447" text-anchor="middle" dominant-baseline="middle" class="small">local f1 → quantified f2</text></g><g transform="translate(424 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">b</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">Replay the selected route</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">Recorded evidence → emitted terms</text><g data-node="map-membership" data-step="2" class="node evidence"><title>Membership citation f15</title><rect x="0" y="60" width="352" height="69" rx="3" class="shape" /><text x="12" y="79" text-anchor="start" dominant-baseline="middle" class="">Membership citation f15</text><text x="12" y="103" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">h_15 : Litex.In … Litex.C</text></g><g data-node="map-construction" data-step="3" class="node evidence"><title>Addition WD evidence</title><rect x="0" y="151" width="352" height="81" rx="3" class="shape" /><text x="12" y="170" text-anchor="start" dominant-baseline="middle" class="">Addition WD evidence</text><text x="12" y="194" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Litex.add … h_15</text><text x="12" y="211" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  (Litex.numberInC …)</text></g><g data-node="map-rule" data-step="4" class="node rule"><title>Calculation / rational</title><rect x="0" y="254" width="352" height="94" rx="3" class="shape" /><text x="12" y="273" text-anchor="start" dominant-baseline="middle" class="">Calculation / rational</text><text x="12" y="297" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Litex.NativeBridge.</text><text x="12" y="314" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  sameOfDenoteNumber …</text><text x="12" y="331" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">  (by ring!)</text></g><g data-node="generated" data-step="5" class="node evidence"><title>Stored f1 / exported f2</title><rect x="0" y="370" width="352" height="69" rx="3" class="shape" /><text x="12" y="389" text-anchor="start" dominant-baseline="middle" class="">Stored f1 / exported f2</text><text x="12" y="413" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">have h_1 … / theorem h_2 …</text></g><text x="0" y="470" text-anchor="start" dominant-baseline="middle" class="small">Fixed normalization inside the selected adapter.</text><text x="0" y="490" text-anchor="start" dominant-baseline="middle" class="small">The final goal does not select a replacement proof.</text></g><g transform="translate(824 349)"><text x="0" y="16" text-anchor="start" dominant-baseline="middle" class="letter">c</text><text x="26" y="16" text-anchor="start" dominant-baseline="middle" class="heading">What Litex.lean supplies</text><text x="26" y="40" text-anchor="start" dominant-baseline="middle" class="small">Lean meaning and proved bridge laws</text><g data-node="objects" data-step="6" class="node evidence"><title>1  Objects keep their conditions</title><rect x="0" y="60" width="352" height="94" rx="3" class="shape" /><text x="12" y="81" text-anchor="start" dominant-baseline="middle" class="">1  Objects keep their conditions</text><text x="12" y="107" text-anchor="start" dominant-baseline="middle" class="small">Obj α = value + WD evidence</text><text x="12" y="132" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Representation M α · denote</text></g><g data-node="meaning" data-step="6" class="node evidence"><title>2  Facts have explicit meanings</title><rect x="0" y="178" width="352" height="94" rx="3" class="shape" /><text x="12" y="199" text-anchor="start" dominant-baseline="middle" class="">2  Facts have explicit meanings</text><text x="12" y="225" text-anchor="start" dominant-baseline="middle" class="small">In a A: membership · Same a b: equal denotations</text><text x="12" y="250" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">Semantics · In · Same</text></g><g data-node="bridges" data-step="6" class="node rule"><title>3  Bridge laws are proved in Lean</title><rect x="0" y="296" width="352" height="107" rx="3" class="shape" /><text x="12" y="317" text-anchor="start" dominant-baseline="middle" class="">3  Bridge laws are proved in Lean</text><text x="12" y="344" text-anchor="start" dominant-baseline="middle" class="small">native equality + denotation witnesses → Same</text><text x="12" y="373" text-anchor="start" dominant-baseline="middle" class="code" xml:space="preserve">NativeBridge.sameOfDenoteNumber</text></g><text x="0" y="436" text-anchor="start" dominant-baseline="middle" class="small">M : Semantics stays explicit.</text><text x="0" y="457" text-anchor="start" dominant-baseline="middle" class="small">The theorem assumes its interpretation laws.</text><text x="0" y="490" text-anchor="start" dominant-baseline="middle" class="small">import Litex provides these declarations and proofs.</text></g><line x1="24" y1="872" x2="1176" y2="872" class="guide" /><text x="24" y="899" text-anchor="start" dominant-baseline="middle" class="heading">Proved library + generated terms → independently checked Lean theorem</text><text x="24" y="925" text-anchor="start" dominant-baseline="middle" class="small">Optional next step: handwritten Adapter → ordinary Lean / Mathlib interface.</text></svg>
