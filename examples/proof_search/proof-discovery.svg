<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 950" width="183mm" height="144.875mm" class="proof-figure" role="img"><title>Find the requirements downward; compose the evidence upward</title><style>
.proof-figure { font-family: Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff; }
.proof-figure text { fill: #20272B; font-size: 15px; font-weight: 400; }
.proof-figure .small { font-size: 13px; fill: #68747B; }
.proof-figure .heading { font-size: 16px; font-weight: 600; }
.proof-figure .panel-letter { font-size: 18.5px; font-weight: 700; }
.proof-figure .math { font-size: 16.2px; }
.proof-figure .code { font-family: 'Courier New', monospace; font-size: 13px; }
.proof-figure .shape { stroke: #A9B4B9; stroke-width: 1; fill: #fff; }
.proof-figure .fact .shape { fill: #F0F7F8; stroke: #8BB9C0; }
.proof-figure .rule .shape { fill: #FCF4ED; stroke: #D7A581; }
.proof-figure .selected-rule .shape { stroke: #C66B32; stroke-width: 1.7; }
.proof-figure .edge { fill: none; stroke: #8B969C; stroke-width: 1; }
.proof-figure .request { stroke-dasharray: 3.5 3.5; }
.proof-figure .evidence { stroke: #007C91; stroke-width: 1.3; }
.proof-figure .selected-edge { stroke: #C66B32; stroke-width: 1.5; }
.proof-figure .guide { fill: none; stroke: #CBD2D5; stroke-width: .8; }
.proof-figure .discovery-title{font-size:26px;font-weight:500}.proof-figure .discovery-math{font-size:23px}.proof-figure .discovery-note{font-size:15px;fill:#68747B}</style><rect width="1200" height="950" fill="white" /><defs><marker id="discovery-en-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#8B969C" stroke-width="1.2" /></marker><marker id="discovery-en-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#007C91" stroke-width="1.2" /></marker><marker id="discovery-en-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#C66B32" stroke-width="1.2" /></marker></defs><text x="36" y="38" text-anchor="start" dominant-baseline="middle" class="discovery-title">Find the requirements downward; compose the evidence upward</text><text x="36" y="81" text-anchor="start" dominant-baseline="middle" class="discovery-note">Example: have x R, then check 0 ≤ (x + 1)². Formation and domain checks precede truth search.</text><g class="fact"><rect x="300" y="116" width="600" height="76" rx="3" class="shape" /><text x="600.0" y="136" text-anchor="middle" dominant-baseline="middle" class="heading">1  Start with the goal</text><text x="600.0" y="167" text-anchor="middle" dominant-baseline="middle" class="discovery-math">0 ≤ (x + 1)²</text></g><g class="rule"><rect x="250" y="233" width="700" height="95" rx="3" class="shape" /><text x="600.0" y="254" text-anchor="middle" dominant-baseline="middle" class="heading">2  Match the real even-power rule</text><text x="600.0" y="284" text-anchor="middle" dominant-baseline="middle" class="discovery-math">u ∈ ℝ  ⇒  0 ≤ u²</text><text x="600.0" y="311" text-anchor="middle" dominant-baseline="middle" class="discovery-note">u = x + 1; the exponent 2 is even</text></g><g class="fact"><rect x="300" y="369" width="600" height="76" rx="3" class="shape" /><text x="600.0" y="389" text-anchor="middle" dominant-baseline="middle" class="heading">3  Ask for the rule's premise</text><text x="600.0" y="420" text-anchor="middle" dominant-baseline="middle" class="discovery-math">x + 1 ∈ ℝ</text></g><g class="rule"><rect x="250" y="486" width="700" height="80" rx="3" class="shape" /><text x="600.0" y="510" text-anchor="middle" dominant-baseline="middle" class="heading">4  Follow the addition structure</text><text x="600.0" y="543" text-anchor="middle" dominant-baseline="middle" class="discovery-note">Both smaller memberships are required</text></g><path d="M 600 196 V 225" class="edge request" marker-end="url(#discovery-en-grey)" /><path d="M 600 332 V 361" class="edge request" marker-end="url(#discovery-en-grey)" /><path d="M 600 449 V 478" class="edge request" marker-end="url(#discovery-en-grey)" /><path d="M 600 570 V 593 H 320 V 620" class="edge request" marker-end="url(#discovery-en-grey)" /><path d="M 600 570 V 593 H 880 V 620" class="edge request" marker-end="url(#discovery-en-grey)" /><g class="fact"><rect x="70" y="628" width="500" height="106" rx="3" class="shape" /><text x="320.0" y="650" text-anchor="middle" dominant-baseline="middle" class="heading">5a  Cite established context</text><text x="320.0" y="680" text-anchor="middle" dominant-baseline="middle" class="discovery-math">x ∈ ℝ</text><text x="320.0" y="711" text-anchor="middle" dominant-baseline="middle" class="discovery-note">have x R → x ∈ ℝ  ·  f2</text></g><g class="fact"><rect x="630" y="628" width="500" height="106" rx="3" class="shape" /><text x="880.0" y="650" text-anchor="middle" dominant-baseline="middle" class="heading">5b  Exact closed calculation</text><text x="880.0" y="680" text-anchor="middle" dominant-baseline="middle" class="discovery-math">1 ∈ ℝ</text><text x="880.0" y="711" text-anchor="middle" dominant-baseline="middle" class="discovery-note">The literal 1 belongs to ℝ</text></g><text x="600" y="765" text-anchor="middle" dominant-baseline="middle" class="discovery-note">AND: both leaves must succeed</text><g class="fact"><rect x="70" y="803" width="1060" height="94" rx="3" class="shape" /><text x="600.0" y="827" text-anchor="middle" dominant-baseline="middle" class="heading">↑  Combine the leaf evidence back up</text><text x="600.0" y="863" text-anchor="middle" dominant-baseline="middle" class="discovery-math">x ∈ ℝ and 1 ∈ ℝ  ⇒  x + 1 ∈ ℝ  ⇒  0 ≤ (x + 1)²</text></g><text x="36" y="922" text-anchor="start" dominant-baseline="middle" class="small">Selected route: EvenPowNonnegative → Direct / Add → Known + Closed.</text><text x="36" y="943" text-anchor="start" dominant-baseline="middle" class="small">A curated successful dependency, not a log of every attempted search candidate.</text></svg>
