<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 898" class="proof-figure" role="img" aria-labelledby="ps-en-figure-title" width="183mm" height="136.95mm"><title id="ps-en-figure-title">Definitions build context; proofs use it</title><desc>Part I checks an object declaration and extends the mathematical context. Part II uses that context to verify a fact and compose its proof evidence. This is a curated teaching projection.</desc><style>
.proof-figure { font-family: Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff; }
.proof-figure text { fill: #20272B; font-size: 15px; font-weight: 400; }
.proof-figure .small { font-size: 13px; fill: #68747B; }
.proof-figure .heading { font-size: 16px; font-weight: 600; }
.proof-figure .panel-letter { font-size: 18.5px; font-weight: 700; }
.proof-figure .math { font-size: 16.2px; }
.proof-figure .code { font-family: 'Courier New', monospace; font-size: 13px; }
.proof-figure .shape { stroke: #A9B4B9; stroke-width: 1; fill: #fff; }
.proof-figure .fact .shape { fill: #F0F7F8; stroke: #8BB9C0; }
.proof-figure .rule .shape { fill: #FCF4ED; stroke: #D7A581; }
.proof-figure .selected-rule .shape { stroke: #C66B32; stroke-width: 1.7; }
.proof-figure .edge { fill: none; stroke: #8B969C; stroke-width: 1; }
.proof-figure .request { stroke-dasharray: 3.5 3.5; }
.proof-figure .evidence { stroke: #007C91; stroke-width: 1.3; }
.proof-figure .selected-edge { stroke: #C66B32; stroke-width: 1.5; }
.proof-figure .guide { fill: none; stroke: #CBD2D5; stroke-width: .8; }
</style><defs><marker id="ps-en-figure-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#8B969C" stroke-width="1.2" /></marker><marker id="ps-en-figure-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#007C91" stroke-width="1.2" /></marker><marker id="ps-en-figure-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#C66B32" stroke-width="1.2" /></marker></defs><rect x="0" y="0" width="1200" height="898" fill="#FFFFFF" /><text x="24" y="27" text-anchor="start" dominant-baseline="middle" class="heading">I  Definitions: build context</text><text x="412" y="27" text-anchor="start" dominant-baseline="middle" class="heading">II  Proofs: use established context</text><path d="M 24 51 H 392 M 412 51 H 1176" class="guide" /><path d="M 400 74 V 758" class="guide" /><g transform="translate(24 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">a</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">Introduce a real object</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">The declaration itself is checked</text><g data-node="declaration" data-steps="0" class="node fact"><title>have x R</title><rect x="31.0" y="85" width="314" height="46" rx="2" class="shape" /><text x="188" y="108" text-anchor="middle" dominant-baseline="middle" class="code">have x R</text></g><text x="188" y="148" text-anchor="middle" dominant-baseline="middle" class="small">x is a real number</text><g data-node="carrier" data-steps="1" class="node"><title>Check the carrier R</title><rect x="31.0" y="182" width="314" height="46" rx="2" class="shape" /><text x="188" y="198" text-anchor="middle" dominant-baseline="middle" class="">Check the carrier R</text><text x="188" y="216" text-anchor="middle" dominant-baseline="middle" class="small">R is well-defined</text></g><g data-node="nonempty" data-steps="1" class="node rule"><title>Check that R is nonempty</title><rect x="31.0" y="262" width="314" height="46" rx="2" class="shape" /><text x="188" y="278" text-anchor="middle" dominant-baseline="middle" class="">Check that R is nonempty</text><text x="188" y="296" text-anchor="middle" dominant-baseline="middle" class="small">StandardSetNonempty builtin</text></g><g data-node="register" data-steps="2" class="node"><title>Register x and its declaration</title><rect x="31.0" y="342" width="314" height="46" rx="2" class="shape" /><text x="188" y="358" text-anchor="middle" dominant-baseline="middle" class="">Register x and its declaration</text><text x="188" y="376" text-anchor="middle" dominant-baseline="middle" class="small">record the membership x ∈ ℝ</text></g><path d="M 188 158 V 180" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 188 229 V 260" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 188 309 V 340" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 188 389 V 421" class="edge" marker-end="url(#ps-en-figure-grey)" /><g data-node="context" data-steps="2 7 8" class="node fact"><path d="M 28 450 C 28 423, 348 423, 348 450 V 596 C 348 623, 28 623, 28 596 Z" class="shape" /><path d="M 28 450 C 28 477, 348 477, 348 450" class="guide" /><text x="188" y="450" text-anchor="middle" dominant-baseline="middle" class="">Current visible scope Γ</text><text x="188" y="588" text-anchor="middle" dominant-baseline="middle" class="small">declaration · membership · source</text></g><g data-node="context-fact" data-steps="2 7" class="node fact"><rect x="48" y="480" width="280" height="85" rx="0" class="shape" /><text x="188" y="499" text-anchor="middle" dominant-baseline="middle" class="math">x ∈ ℝ</text><text x="188" y="522" text-anchor="middle" dominant-baseline="middle" class="code">from: have x R</text><text x="188" y="546" text-anchor="middle" dominant-baseline="middle" class="small">x is a real number</text></g><text x="188" y="665" text-anchor="middle" dominant-baseline="middle" class="small">Declaration checks can invoke proof rules.</text><path d="M 355 654 V 624 H 188 V 620" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /></g><g transform="translate(412 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">b</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">Search for a proof</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">Check a new fact in the established context</text><g data-node="goal" data-steps="3" class="node"><title>0 ≤ (x + 1)²</title><rect x="31.0" y="84" width="280" height="46" rx="2" class="shape" /><text x="171" y="100" text-anchor="middle" dominant-baseline="middle" class="math">0 ≤ (x + 1)²</text><text x="171" y="118" text-anchor="middle" dominant-baseline="middle" class="small">Classify the fact</text></g><path d="M 171 131 V 148" class="edge" marker-end="url(#ps-en-figure-grey)" /><g data-node="wd" data-steps="4" class="node"><title>Check well-definedness</title><rect x="31.0" y="151" width="280" height="46" rx="2" class="shape" /><text x="171" y="167" text-anchor="middle" dominant-baseline="middle" class="">Check well-definedness</text><text x="171" y="185" text-anchor="middle" dominant-baseline="middle" class="small">objects · signature · domains</text></g><path d="M 171 198 V 220" class="edge" marker-end="url(#ps-en-figure-grey)" /><text x="171" y="242" text-anchor="middle" dominant-baseline="middle" class="small">Truth search: try allowed routes in order</text><g data-node="direct" data-steps="" class="node"><rect x="31" y="266" width="280" height="32" rx="0" class="shape" /><text x="171" y="282" text-anchor="middle" dominant-baseline="middle" class="">Direct evidence</text></g><path d="M 171 298 V 305" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 282 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><g data-node="known" data-steps="" class="node"><rect x="31" y="306" width="280" height="32" rx="0" class="shape" /><text x="171" y="322" text-anchor="middle" dominant-baseline="middle" class="">Known facts / special properties</text></g><path d="M 171 338 V 345" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 322 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><g data-node="builtin" data-steps="5" class="node rule selected-rule"><rect x="31" y="346" width="280" height="32" rx="0" class="shape" /><text x="171" y="362" text-anchor="middle" dominant-baseline="middle" class="">Builtin rule</text></g><path d="M 171 378 V 385" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 362 H 352" class="edge selected-edge" marker-end="url(#ps-en-figure-orange)" /><g data-node="strategy" data-steps="" class="node"><rect x="31" y="386" width="280" height="32" rx="0" class="shape" /><text x="171" y="402" text-anchor="middle" dominant-baseline="middle" class="">Strategy</text></g><path d="M 171 418 V 425" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 402 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><g data-node="definition" data-steps="" class="node"><rect x="31" y="426" width="280" height="32" rx="0" class="shape" /><text x="171" y="442" text-anchor="middle" dominant-baseline="middle" class="">Definition</text></g><path d="M 171 458 V 465" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 442 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><g data-node="forall" data-steps="" class="node"><rect x="31" y="466" width="280" height="32" rx="0" class="shape" /><text x="171" y="482" text-anchor="middle" dominant-baseline="middle" class="">Known forall</text></g><path d="M 171 498 V 505" class="edge" marker-end="url(#ps-en-figure-grey)" /><path d="M 311 482 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><g data-node="rewrite" data-steps="" class="node"><rect x="31" y="506" width="280" height="32" rx="0" class="shape" /><text x="171" y="522" text-anchor="middle" dominant-baseline="middle" class="">Rewrite (final fallback)</text></g><path d="M 311 522 H 352" class="guide" marker-end="url(#ps-en-figure-grey)" /><path d="M 352 282 V 626 H 314" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 352 362 V 626 H 314" class="edge selected-edge" marker-end="url(#ps-en-figure-orange)" /><path d="M 171 539 V 557" class="edge" marker-end="url(#ps-en-figure-grey)" /><text x="171" y="572" text-anchor="middle" dominant-baseline="middle" class="">No proof found</text><text x="171" y="590" text-anchor="middle" dominant-baseline="middle" class="small">all allowed routes miss</text><g data-node="proof" data-steps="8" class="node fact"><title>Return proof evidence</title><rect x="31.0" y="603" width="280" height="46" rx="2" class="shape" /><text x="171" y="626" text-anchor="middle" dominant-baseline="middle" class="">Return proof evidence</text></g><text x="171" y="664" text-anchor="middle" dominant-baseline="middle" class="small">Premises inherit restricted search permissions.</text></g><g transform="translate(800 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">c</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">Composed proof evidence</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">The selected rule and its checked premise</text><path d="M 183 130 C 183 149.5, 183 149.5, 183 169" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 193 169 C 193 149.5, 193 149.5, 193 130" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 183 211 C 183 231.0, 183 231.0, 183 251" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 193 251 C 193 231.0, 193 231.0, 193 211" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 183 297 C 183 317.0, 183 317.0, 183 337" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 193 337 C 193 317.0, 193 317.0, 193 297" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 183 379 C 183 403.5, 83 403.5, 83 428" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 93 428 C 93 403.5, 193 403.5, 193 379" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 183 379 C 183 403.5, 283 403.5, 283 428" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 293 428 C 293 403.5, 193 403.5, 193 379" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 83 475 C 83 499.5, 83 499.5, 83 524" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 93 524 C 93 499.5, 93 499.5, 93 475" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 283 475 C 283 499.5, 283 499.5, 283 524" class="edge request" marker-end="url(#ps-en-figure-grey)" /><path d="M 293 524 C 293 499.5, 293 499.5, 293 475" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><g data-node="result" data-steps="8" class="node fact"><title>0 ≤ (x + 1)²</title><rect x="66.0" y="84" width="244" height="46" rx="2" class="shape" /><text x="188" y="107" text-anchor="middle" dominant-baseline="middle" class="math">0 ≤ (x + 1)²</text></g><g data-node="square" data-steps="5 8" class="node rule"><title>Even real powers are nonnegative</title><polygon points="18.0,190 30.0,169 346.0,169 358.0,190 346.0,211 30.0,211" class="shape" /><text x="188" y="190" text-anchor="middle" dominant-baseline="middle" class="">Even real powers are nonnegative</text></g><g data-node="real" data-steps="5 6 8" class="node fact"><title>x + 1 ∈ ℝ</title><rect x="53.0" y="251" width="270" height="46" rx="2" class="shape" /><text x="188" y="274" text-anchor="middle" dominant-baseline="middle" class="math">x + 1 ∈ ℝ</text></g><g data-node="add" data-steps="6 8" class="node rule"><title>Real addition is closed</title><polygon points="41.0,358 53.0,337 323.0,337 335.0,358 323.0,379 53.0,379" class="shape" /><text x="188" y="358" text-anchor="middle" dominant-baseline="middle" class="">Real addition is closed</text></g><g data-node="x" data-steps="6 7 8" class="node fact"><title>x ∈ ℝ</title><rect x="10.0" y="428" width="156" height="46" rx="2" class="shape" /><text x="88" y="451" text-anchor="middle" dominant-baseline="middle" class="math">x ∈ ℝ</text></g><g data-node="one" data-steps="6 7 8" class="node fact"><title>1 ∈ ℝ</title><rect x="210.0" y="428" width="156" height="46" rx="2" class="shape" /><text x="288" y="451" text-anchor="middle" dominant-baseline="middle" class="math">1 ∈ ℝ</text></g><g data-node="lookup" data-steps="7" class="node fact"><title>Context citation</title><path d="M 9.0 534 C 9.0 515, 167.0 515, 167.0 534 V 563 C 167.0 582, 9.0 582, 9.0 563 Z" class="shape" /><path d="M 9.0 534 C 9.0 552, 167.0 552, 167.0 534" class="guide" /><text x="88" y="557" text-anchor="middle" dominant-baseline="middle" class="">Context citation</text></g><g data-node="calculation" data-steps="7" class="node"><title>Exact calculation</title><rect x="209.0" y="526" width="158" height="46" rx="2" class="shape" /><text x="288" y="549" text-anchor="middle" dominant-baseline="middle" class="">Exact calculation</text></g><text x="188" y="611" text-anchor="middle" dominant-baseline="middle" class="small">AND: both premises are required</text><text x="188" y="643" text-anchor="middle" dominant-baseline="middle" class="small">Builtin rule → Direct → context / calculation</text></g><g transform="translate(24 780)"><path d="M 0 0 H 1152" class="guide" /><g data-node="commit" data-steps="8" class="node fact"><title>Updated context</title><rect x="31.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="140" y="39" text-anchor="middle" dominant-baseline="middle" class="">Updated context</text></g><g data-node="commit" data-steps="8" class="node"><title>Direct inference, once</title><rect x="321.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="430" y="39" text-anchor="middle" dominant-baseline="middle" class="">Direct inference, once</text></g><g data-node="commit" data-steps="8" class="node"><title>Store</title><rect x="601.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="710" y="39" text-anchor="middle" dominant-baseline="middle" class="">Store</text></g><g data-node="commit" data-steps="8" class="node fact"><title>Verified fact</title><rect x="887.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="996" y="39" text-anchor="middle" dominant-baseline="middle" class="">Verified fact</text></g><path d="M 887 39 H 819" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 601 39 H 539" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 321 39 H 249" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><path d="M 60 91 H 104" class="edge request" marker-end="url(#ps-en-figure-grey)" /><text x="113" y="91" text-anchor="start" dominant-baseline="middle" class="small">required condition</text><path d="M 380 91 H 424" class="edge evidence" marker-end="url(#ps-en-figure-teal)" /><text x="433" y="91" text-anchor="start" dominant-baseline="middle" class="small">returned evidence</text><polygon points="716,91 724,84 732,91 724,98" fill="#FCF4ED" stroke="#C66B32" stroke-width="1" /><text x="741" y="91" text-anchor="start" dominant-baseline="middle" class="small">mathematical rule</text></g><path d="M 164 796 V 762 H 379 V 728" class="edge evidence" /></svg>
