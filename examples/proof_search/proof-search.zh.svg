<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 898" class="proof-figure" role="img" aria-labelledby="ps-zh-figure-title" width="183mm" height="136.95mm"><title id="ps-zh-figure-title">定义建立上下文，证明使用上下文</title><desc>Part I checks an object declaration and extends the mathematical context. Part II uses that context to verify a fact and compose its proof evidence. This is a curated teaching projection.</desc><style>
.proof-figure { font-family: Arial, Helvetica, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #fff; }
.proof-figure text { fill: #20272B; font-size: 15px; font-weight: 400; }
.proof-figure .small { font-size: 13px; fill: #68747B; }
.proof-figure .heading { font-size: 16px; font-weight: 600; }
.proof-figure .panel-letter { font-size: 18.5px; font-weight: 700; }
.proof-figure .math { font-size: 16.2px; }
.proof-figure .code { font-family: 'Courier New', monospace; font-size: 13px; }
.proof-figure .shape { stroke: #A9B4B9; stroke-width: 1; fill: #fff; }
.proof-figure .fact .shape { fill: #F0F7F8; stroke: #8BB9C0; }
.proof-figure .rule .shape { fill: #FCF4ED; stroke: #D7A581; }
.proof-figure .selected-rule .shape { stroke: #C66B32; stroke-width: 1.7; }
.proof-figure .edge { fill: none; stroke: #8B969C; stroke-width: 1; }
.proof-figure .request { stroke-dasharray: 3.5 3.5; }
.proof-figure .evidence { stroke: #007C91; stroke-width: 1.3; }
.proof-figure .selected-edge { stroke: #C66B32; stroke-width: 1.5; }
.proof-figure .guide { fill: none; stroke: #CBD2D5; stroke-width: .8; }
</style><defs><marker id="ps-zh-figure-grey" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#8B969C" stroke-width="1.2" /></marker><marker id="ps-zh-figure-teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#007C91" stroke-width="1.2" /></marker><marker id="ps-zh-figure-orange" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#C66B32" stroke-width="1.2" /></marker></defs><rect x="0" y="0" width="1200" height="898" fill="#FFFFFF" /><text x="24" y="27" text-anchor="start" dominant-baseline="middle" class="heading">I  定义：建立数学上下文</text><text x="412" y="27" text-anchor="start" dominant-baseline="middle" class="heading">II  证明：使用已有数学上下文</text><path d="M 24 51 H 392 M 412 51 H 1176" class="guide" /><path d="M 400 74 V 758" class="guide" /><g transform="translate(24 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">a</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">引入一个实数对象</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">声明本身也要经过检查</text><g data-node="declaration" data-steps="0" class="node fact"><title>have x R</title><rect x="31.0" y="85" width="314" height="46" rx="2" class="shape" /><text x="188" y="108" text-anchor="middle" dominant-baseline="middle" class="code">have x R</text></g><text x="188" y="148" text-anchor="middle" dominant-baseline="middle" class="small">x 是一个实数</text><g data-node="carrier" data-steps="1" class="node"><title>检查集合 R</title><rect x="31.0" y="182" width="314" height="46" rx="2" class="shape" /><text x="188" y="198" text-anchor="middle" dominant-baseline="middle" class="">检查集合 R</text><text x="188" y="216" text-anchor="middle" dominant-baseline="middle" class="small">R 是合法的集合对象</text></g><g data-node="nonempty" data-steps="1" class="node rule"><title>检查 R 非空</title><rect x="31.0" y="262" width="314" height="46" rx="2" class="shape" /><text x="188" y="278" text-anchor="middle" dominant-baseline="middle" class="">检查 R 非空</text><text x="188" y="296" text-anchor="middle" dominant-baseline="middle" class="small">内置规则 StandardSetNonempty</text></g><g data-node="register" data-steps="2" class="node"><title>登记名称 x 与它的声明</title><rect x="31.0" y="342" width="314" height="46" rx="2" class="shape" /><text x="188" y="358" text-anchor="middle" dominant-baseline="middle" class="">登记名称 x 与它的声明</text><text x="188" y="376" text-anchor="middle" dominant-baseline="middle" class="small">记录成员关系 x ∈ ℝ</text></g><path d="M 188 158 V 180" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 188 229 V 260" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 188 309 V 340" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 188 389 V 421" class="edge" marker-end="url(#ps-zh-figure-grey)" /><g data-node="context" data-steps="2 7 8" class="node fact"><path d="M 28 450 C 28 423, 348 423, 348 450 V 596 C 348 623, 28 623, 28 596 Z" class="shape" /><path d="M 28 450 C 28 477, 348 477, 348 450" class="guide" /><text x="188" y="450" text-anchor="middle" dominant-baseline="middle" class="">当前可见作用域 Γ</text><text x="188" y="588" text-anchor="middle" dominant-baseline="middle" class="small">声明 · 成员关系 · 来源</text></g><g data-node="context-fact" data-steps="2 7" class="node fact"><rect x="48" y="480" width="280" height="85" rx="0" class="shape" /><text x="188" y="499" text-anchor="middle" dominant-baseline="middle" class="math">x ∈ ℝ</text><text x="188" y="522" text-anchor="middle" dominant-baseline="middle" class="code">来源：have x R</text><text x="188" y="546" text-anchor="middle" dominant-baseline="middle" class="small">x 是一个实数</text></g><text x="188" y="665" text-anchor="middle" dominant-baseline="middle" class="small">定义/声明的检查，也会使用证明规则。</text><path d="M 355 654 V 624 H 188 V 620" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /></g><g transform="translate(412 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">b</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">搜索事实的证明</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">在已建立的上下文中验证新事实</text><g data-node="goal" data-steps="3" class="node"><title>0 ≤ (x + 1)²</title><rect x="31.0" y="84" width="280" height="46" rx="2" class="shape" /><text x="171" y="100" text-anchor="middle" dominant-baseline="middle" class="math">0 ≤ (x + 1)²</text><text x="171" y="118" text-anchor="middle" dominant-baseline="middle" class="small">识别事实形状</text></g><path d="M 171 131 V 148" class="edge" marker-end="url(#ps-zh-figure-grey)" /><g data-node="wd" data-steps="4" class="node"><title>检查良定义性</title><rect x="31.0" y="151" width="280" height="46" rx="2" class="shape" /><text x="171" y="167" text-anchor="middle" dominant-baseline="middle" class="">检查良定义性</text><text x="171" y="185" text-anchor="middle" dominant-baseline="middle" class="small">对象 · 谓词签名 · 适用域</text></g><path d="M 171 198 V 220" class="edge" marker-end="url(#ps-zh-figure-grey)" /><text x="171" y="242" text-anchor="middle" dominant-baseline="middle" class="small">证明搜索：按顺序尝试允许的入口</text><g data-node="direct" data-steps="" class="node"><rect x="31" y="266" width="280" height="32" rx="0" class="shape" /><text x="171" y="282" text-anchor="middle" dominant-baseline="middle" class="">直接证据 Direct</text></g><path d="M 171 298 V 305" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 282 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><g data-node="known" data-steps="" class="node"><rect x="31" y="306" width="280" height="32" rx="0" class="shape" /><text x="171" y="322" text-anchor="middle" dominant-baseline="middle" class="">已知事实匹配 / 对象属性</text></g><path d="M 171 338 V 345" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 322 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><g data-node="builtin" data-steps="5" class="node rule selected-rule"><rect x="31" y="346" width="280" height="32" rx="0" class="shape" /><text x="171" y="362" text-anchor="middle" dominant-baseline="middle" class="">内置规则 Builtin rule</text></g><path d="M 171 378 V 385" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 362 H 352" class="edge selected-edge" marker-end="url(#ps-zh-figure-orange)" /><g data-node="strategy" data-steps="" class="node"><rect x="31" y="386" width="280" height="32" rx="0" class="shape" /><text x="171" y="402" text-anchor="middle" dominant-baseline="middle" class="">策略 Strategy</text></g><path d="M 171 418 V 425" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 402 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><g data-node="definition" data-steps="" class="node"><rect x="31" y="426" width="280" height="32" rx="0" class="shape" /><text x="171" y="442" text-anchor="middle" dominant-baseline="middle" class="">定义 Definition</text></g><path d="M 171 458 V 465" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 442 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><g data-node="forall" data-steps="" class="node"><rect x="31" y="466" width="280" height="32" rx="0" class="shape" /><text x="171" y="482" text-anchor="middle" dominant-baseline="middle" class="">已知全称事实</text></g><path d="M 171 498 V 505" class="edge" marker-end="url(#ps-zh-figure-grey)" /><path d="M 311 482 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><g data-node="rewrite" data-steps="" class="node"><rect x="31" y="506" width="280" height="32" rx="0" class="shape" /><text x="171" y="522" text-anchor="middle" dominant-baseline="middle" class="">改写：最后尝试</text></g><path d="M 311 522 H 352" class="guide" marker-end="url(#ps-zh-figure-grey)" /><path d="M 352 282 V 626 H 314" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 352 362 V 626 H 314" class="edge selected-edge" marker-end="url(#ps-zh-figure-orange)" /><path d="M 171 539 V 557" class="edge" marker-end="url(#ps-zh-figure-grey)" /><text x="171" y="572" text-anchor="middle" dominant-baseline="middle" class="">未找到证明</text><text x="171" y="590" text-anchor="middle" dominant-baseline="middle" class="small">允许的入口均未命中</text><g data-node="proof" data-steps="8" class="node fact"><title>返回证明证据</title><rect x="31.0" y="603" width="280" height="46" rx="2" class="shape" /><text x="171" y="626" text-anchor="middle" dominant-baseline="middle" class="">返回证明证据</text></g><text x="171" y="664" text-anchor="middle" dominant-baseline="middle" class="small">前提检查继承受限的搜索权限。</text></g><g transform="translate(800 74)"><text x="0" y="26" text-anchor="start" dominant-baseline="middle" class="panel-letter">c</text><text x="28" y="26" text-anchor="start" dominant-baseline="middle" class="heading">组合证明证据</text><text x="0" y="57" text-anchor="start" dominant-baseline="middle" class="small">选中的规则，以及已检查的规则前提</text><path d="M 183 130 C 183 149.5, 183 149.5, 183 169" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 193 169 C 193 149.5, 193 149.5, 193 130" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 183 211 C 183 231.0, 183 231.0, 183 251" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 193 251 C 193 231.0, 193 231.0, 193 211" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 183 297 C 183 317.0, 183 317.0, 183 337" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 193 337 C 193 317.0, 193 317.0, 193 297" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 183 379 C 183 403.5, 83 403.5, 83 428" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 93 428 C 93 403.5, 193 403.5, 193 379" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 183 379 C 183 403.5, 283 403.5, 283 428" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 293 428 C 293 403.5, 193 403.5, 193 379" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 83 475 C 83 499.5, 83 499.5, 83 524" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 93 524 C 93 499.5, 93 499.5, 93 475" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 283 475 C 283 499.5, 283 499.5, 283 524" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><path d="M 293 524 C 293 499.5, 293 499.5, 293 475" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><g data-node="result" data-steps="8" class="node fact"><title>0 ≤ (x + 1)²</title><rect x="66.0" y="84" width="244" height="46" rx="2" class="shape" /><text x="188" y="107" text-anchor="middle" dominant-baseline="middle" class="math">0 ≤ (x + 1)²</text></g><g data-node="square" data-steps="5 8" class="node rule"><title>实数的偶次幂非负</title><polygon points="18.0,190 30.0,169 346.0,169 358.0,190 346.0,211 30.0,211" class="shape" /><text x="188" y="190" text-anchor="middle" dominant-baseline="middle" class="">实数的偶次幂非负</text></g><g data-node="real" data-steps="5 6 8" class="node fact"><title>x + 1 ∈ ℝ</title><rect x="53.0" y="251" width="270" height="46" rx="2" class="shape" /><text x="188" y="274" text-anchor="middle" dominant-baseline="middle" class="math">x + 1 ∈ ℝ</text></g><g data-node="add" data-steps="6 8" class="node rule"><title>实数加法封闭</title><polygon points="41.0,358 53.0,337 323.0,337 335.0,358 323.0,379 53.0,379" class="shape" /><text x="188" y="358" text-anchor="middle" dominant-baseline="middle" class="">实数加法封闭</text></g><g data-node="x" data-steps="6 7 8" class="node fact"><title>x ∈ ℝ</title><rect x="10.0" y="428" width="156" height="46" rx="2" class="shape" /><text x="88" y="451" text-anchor="middle" dominant-baseline="middle" class="math">x ∈ ℝ</text></g><g data-node="one" data-steps="6 7 8" class="node fact"><title>1 ∈ ℝ</title><rect x="210.0" y="428" width="156" height="46" rx="2" class="shape" /><text x="288" y="451" text-anchor="middle" dominant-baseline="middle" class="math">1 ∈ ℝ</text></g><g data-node="lookup" data-steps="7" class="node fact"><title>引用上下文</title><path d="M 9.0 534 C 9.0 515, 167.0 515, 167.0 534 V 563 C 167.0 582, 9.0 582, 9.0 563 Z" class="shape" /><path d="M 9.0 534 C 9.0 552, 167.0 552, 167.0 534" class="guide" /><text x="88" y="557" text-anchor="middle" dominant-baseline="middle" class="">引用上下文</text></g><g data-node="calculation" data-steps="7" class="node"><title>精确计算</title><rect x="209.0" y="526" width="158" height="46" rx="2" class="shape" /><text x="288" y="549" text-anchor="middle" dominant-baseline="middle" class="">精确计算</text></g><text x="188" y="611" text-anchor="middle" dominant-baseline="middle" class="small">AND：两个前提都必须成立</text><text x="188" y="643" text-anchor="middle" dominant-baseline="middle" class="small">内置规则 → Direct 结构检查 → 上下文 / 计算</text></g><g transform="translate(24 780)"><path d="M 0 0 H 1152" class="guide" /><g data-node="commit" data-steps="8" class="node fact"><title>更新上下文</title><rect x="31.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="140" y="39" text-anchor="middle" dominant-baseline="middle" class="">更新上下文</text></g><g data-node="commit" data-steps="8" class="node"><title>直接推导一次</title><rect x="321.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="430" y="39" text-anchor="middle" dominant-baseline="middle" class="">直接推导一次</text></g><g data-node="commit" data-steps="8" class="node"><title>存储</title><rect x="601.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="710" y="39" text-anchor="middle" dominant-baseline="middle" class="">存储</text></g><g data-node="commit" data-steps="8" class="node fact"><title>已验证事实</title><rect x="887.0" y="16" width="218" height="46" rx="2" class="shape" /><text x="996" y="39" text-anchor="middle" dominant-baseline="middle" class="">已验证事实</text></g><path d="M 887 39 H 819" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 601 39 H 539" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 321 39 H 249" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><path d="M 60 91 H 104" class="edge request" marker-end="url(#ps-zh-figure-grey)" /><text x="113" y="91" text-anchor="start" dominant-baseline="middle" class="small">需要的条件</text><path d="M 380 91 H 424" class="edge evidence" marker-end="url(#ps-zh-figure-teal)" /><text x="433" y="91" text-anchor="start" dominant-baseline="middle" class="small">返回的证据</text><polygon points="716,91 724,84 732,91 724,98" fill="#FCF4ED" stroke="#C66B32" stroke-width="1" /><text x="741" y="91" text-anchor="start" dominant-baseline="middle" class="small">数学规则</text></g><path d="M 164 796 V 762 H 379 V 728" class="edge evidence" /></svg>
