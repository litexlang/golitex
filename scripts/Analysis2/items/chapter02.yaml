- source: "Tao, Analysis II, fourth edition, Definition 2.1.1"
  problem: "Define continuity of a typed map between metric spaces at a point and on its whole domain."
  proof_idea: "Expose one epsilon-delta control condition as a residual relation; quantify over positive epsilon and select a positive delta for pointwise continuity; quantify pointwise continuity over the domain for global continuity."
  litex_code: |
    prop is_metric_continuous_at(X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, f fn(x X) Y, a X):
        forall epsilon R_pos:
            exist delta R_pos st {$is_metric_delta_controlled_at(X, Y, dist_X, dist_Y, f, a, epsilon, delta)}

    prop is_metric_continuous(X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, f fn(x X) Y):
        forall a X:
            $is_metric_continuous_at(X, Y, dist_X, dist_Y, f, a)
  comments: "Status: checkable. Each declaration and the projection use probe verified in one release `-session -before` workflow on 2026-07-26. Final file gate remains pending while Chapter 2 is under construction. This is a concise mathematical reformulation of the copyrighted source."

- source: "Tao, Analysis II, fourth edition, Theorem 2.1.4"
  problem: "Characterize continuity at a point equivalently by preservation of convergent sequences and by the open-neighborhood condition."
  proof_idea: "For epsilon-delta continuity, transport an eventual delta-tail to an epsilon-tail. Conversely, a failure of continuity supplies points at distances tending to zero whose images stay epsilon-separated. For the neighborhood form, use an output ball and its input delta-ball; conversely apply the neighborhood condition to an epsilon-ball."
  litex_code: |
    thm metric_continuous_at_implies_preserves_limits:
        ? forall X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, f fn(x X) Y, a X:
            $chap1::is_metric_space(X, dist_X)
            $chap1::is_metric_space(Y, dist_Y)
            $is_metric_continuous_at(X, Y, dist_X, dist_Y, f, a)
            =>:
                $preserves_metric_limits_at(X, Y, dist_X, dist_Y, f, a)
        # The checked chapter proof transports the delta / 2 convergence tail.
  comments: "Status: translated; blocker label: trust. The forward sequential direction is checkable. Three directions remain trusted: the reverse sequential direction needs shrinking-radius choice, and the neighborhood directions depend on pointwise-to-subset bridges. Verified in a persistent release session and with the registered Chapter 2 file gate on 2026-07-26."

- source: "Tao, Analysis II, fourth edition, Theorem 2.1.5"
  problem: "Characterize global metric continuity by preservation of convergent sequences and by open- or closed-set inverse images."
  proof_idea: "Quantify the pointwise sequential characterization over every possible limit. For open inverse images, apply the local neighborhood characterization at each preimage point; obtain the closed version through complements."
  litex_code: |
    template<X, Y set, f fn(x X) Y, E power_set(Y)>:
        have function_preimage power_set(X) = {x X: f(x) $in E}

    prop pulls_back_metric_open_sets(X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, f fn(x X) Y):
        forall V power_set(Y):
            $chap1::is_metric_open(Y, dist_Y, V)
            =>:
                $chap1::is_metric_open(X, dist_X, \function_preimage<X, Y, f, V>)
  comments: "Status: translated; blocker label: trust. The sequential equivalence is checkable via Theorem 2.1.4. Four open/closed inverse-image directions retain narrow trusts because Tao assigns the proof to Exercise 2.1.2 and the direct route reaches the Chapter 1 pointwise-to-subset bridge debt. Verified in the release session on 2026-07-26."

- source: "Tao, Analysis II, fourth edition, Corollary 2.1.7"
  problem: "Show that the composition of maps continuous at the relevant points is continuous, and deduce the global composition result."
  proof_idea: "Given an output epsilon, take a positive input tolerance for the outer map and then a positive input tolerance for the inner map. The same delta controls the composition. Quantify the pointwise result over the domain for global continuity."
  litex_code: |
    thm metric_continuous_at_composition:
        ? forall X, Y, W set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, dist_W fn(x, y W) R, f fn(x X) Y, g fn(y Y) W, a X:
            $is_metric_continuous_at(X, Y, dist_X, dist_Y, f, a)
            $is_metric_continuous_at(Y, W, dist_Y, dist_W, g, f(a))
            =>:
                $is_metric_continuous_at(X, W, dist_X, dist_W, fn(x X) W {g(f(x))}, a)
        # Full epsilon-delta proof is in the chapter file.
  comments: "Status: checkable. Both pointwise and global composition theorems verified without trust in the persistent release session on 2026-07-26."

- source: "Tao, Analysis II, fourth edition, Lemma 2.2.1"
  problem: "Relate continuity of two real-valued component functions to continuity of their paired map into Euclidean R^2, both at a point and globally."
  proof_idea: "Represent the pair as a two-coordinate finite real vector. Use equivalence of Euclidean convergence and coordinatewise convergence together with the sequential continuity characterization."
  litex_code: |
    template<X set, f, g fn(x X) R>:
        have fn real_function_pair(x X) \chap1::finite_real_vector<2> = fn(j N_pos: j <= 2) R {real_pair_coordinate(f(x), g(x), j)}

    thm real_components_continuous_at_imply_pair:
        ? forall X set, dist fn(x, y X) R, f, g fn(x X) R, a X:
            $chap1::is_metric_space(X, dist)
            $is_metric_continuous_at(X, R, dist, chap1::real_distance, f, a)
            $is_metric_continuous_at(X, R, dist, chap1::real_distance, g, a)
            =>:
                $is_metric_continuous_at(X, \chap1::finite_real_vector<2>, dist, \chap1::l2_distance<2>, \real_function_pair<X, f, g>, a)
        trust $is_metric_continuous_at(X, \chap1::finite_real_vector<2>, dist, \chap1::l2_distance<2>, \real_function_pair<X, f, g>, a)
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.2.1. The paired function is concrete and verified; four reusable equivalence directions retain narrow trusts."

- source: "Tao, Analysis II, fourth edition, Lemma 2.2.2"
  problem: "State continuity of addition, subtraction, multiplication, maximum, minimum, division away from zero, and scalar multiplication on real Euclidean spaces."
  proof_idea: "Use real limit laws with the sequential characterization. Maximum and minimum can be treated by their two order cases, and division is restricted to pairs with nonzero second coordinate."
  litex_code: |
    have fn real_pair_add(v \chap1::finite_real_vector<2>) R = v(1) + v(2)
    have fn real_pair_subtract(v \chap1::finite_real_vector<2>) R = v(1) - v(2)
    have fn real_pair_multiply(v \chap1::finite_real_vector<2>) R = v(1) * v(2)

    thm real_pair_add_is_continuous_at_every_point:
        ? forall a \chap1::finite_real_vector<2>:
            $is_metric_continuous_at(\chap1::finite_real_vector<2>, R, \chap1::l2_distance<2>, chap1::real_distance, real_pair_add, a)
        trust $is_metric_continuous_at(\chap1::finite_real_vector<2>, R, \chap1::l2_distance<2>, chap1::real_distance, real_pair_add, a)
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.2.2. All seven maps are concrete, and their universal pointwise-continuity statements verified with explicit trust boundaries."

- source: "Tao, Analysis II, fourth edition, Corollary 2.2.3"
  problem: "Show that pointwise and global continuity are preserved by real-valued sums, differences, products, maxima, minima, scalar multiples, and quotients with nowhere-zero denominator."
  proof_idea: "Pair the two real-valued maps, compose the pair with the appropriate continuous arithmetic map, and then quantify the pointwise result over the domain. For division, restrict the paired codomain to vectors with nonzero second coordinate."
  litex_code: |
    thm continuous_at_real_function_sum:
        ? forall X set, dist fn(x, y X) R, f, g fn(x X) R, a X:
            $chap1::is_metric_space(X, dist)
            $is_metric_continuous_at(X, R, dist, chap1::real_distance, f, a)
            $is_metric_continuous_at(X, R, dist, chap1::real_distance, g, a)
            =>:
                $is_metric_continuous_at(X, R, dist, chap1::real_distance, \real_function_sum<X, f, g>, a)
        trust $is_metric_continuous_at(X, R, dist, chap1::real_distance, \real_function_sum<X, f, g>, a)

    thm continuous_real_function_sum:
        # The chapter file checks this by applying the pointwise result at each a in X.
  comments: "Status: translated; blocker label: trust. All seven pointwise conclusions have narrow trusts. All seven global conclusions are checkable by quantifying their corresponding pointwise theorem. The direct sum proof verified pairing, arithmetic continuity, and composition, then stopped at equality between the template pair/add composition and the named pointwise function."

- source: "Tao, Analysis II, fourth edition, Theorem 2.3.1"
  problem: "Show that the image of a compact metric subset under a continuous map is compact."
  proof_idea: "Given a sequence in the image, choose preimages in the compact domain subset, extract a convergent subsequence there, and use continuity to transport its limit to the image."
  litex_code: |
    template<X, Y set, f fn(x X) Y, K power_set(X)>:
        have function_image power_set(Y) = {y Y: $has_preimage_in_subset(X, Y, K, f, y)}

    thm continuous_map_preserves_metric_compactness:
        # Full statement is in the chapter file.
        trust $chap1::is_metric_compact(Y, dist_Y, \function_image<X, Y, f, K>)
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.3.1. The image is a concrete set construction."

- source: "Tao, Analysis II, fourth edition, Proposition 2.3.2"
  problem: "A continuous real-valued function on a compact metric space is bounded and, on a nonempty domain, attains both a maximum and a minimum."
  proof_idea: "The continuous image is a compact subset of the real line, hence bounded and closed. Its supremum and infimum belong to the image when the domain is nonempty."
  litex_code: |
    prop attains_real_maximum_at(X set, f fn(x X) R, a X):
        forall x X:
            f(x) <= f(a)

    thm compact_continuous_real_function_attains_extrema:
        # Full statement is in the chapter file.
        trust:
            exist xmax X st {$attains_real_maximum_at(X, f, xmax)}
            exist xmin X st {$attains_real_minimum_at(X, f, xmin)}
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.3.2. Boundedness and extrema are separated into reusable source-facing theorems."

- source: "Tao, Analysis II, fourth edition, Definition 2.3.4"
  problem: "Define uniform continuity between metric spaces."
  proof_idea: "For every positive output tolerance, choose one positive input tolerance that controls all pairs of domain points."
  litex_code: |
    prop is_metric_uniformly_continuous(X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, f fn(x X) Y):
        forall epsilon R_pos:
            exist delta R_pos st {$is_uniform_delta_controlled(X, Y, dist_X, dist_Y, f, epsilon, delta)}
  comments: "Status: checkable. The residual and quantified predicates verified in the persistent release session."

- source: "Tao, Analysis II, fourth edition, Theorem 2.3.5"
  problem: "On a compact metric domain, continuity and uniform continuity are equivalent."
  proof_idea: "Uniform continuity gives pointwise continuity by fixing one endpoint. Conversely, take local epsilon/2 radii, extract a finite ball cover by compactness, and choose the minimum of the finitely many half-radii."
  litex_code: |
    thm metric_uniformly_continuous_implies_continuous:
        # Full checked epsilon-delta proof is in the chapter file.

    thm compact_metric_continuous_implies_uniformly_continuous:
        # Full statement is in the chapter file.
        trust $is_metric_uniformly_continuous(X, Y, dist_X, dist_Y, f)
  comments: "Status: translated. Uniform-to-continuous is checkable. The compact-to-uniform direction is labeled trust because the source proof depends on Chapter 1's trusted finite-open-subcover theorem and finite minimum selection."

- source: "Tao, Analysis II, fourth edition, Definition 2.4.1"
  problem: "Define disconnected and connected metric spaces, with the empty space declared to be neither."
  proof_idea: "A separation consists of two disjoint nonempty open subsets whose union is the carrier. Disconnectedness requires such a witness and nonemptiness; connectedness requires nonemptiness and absence of a separation."
  litex_code: |
    prop is_metric_connected(X set, dist fn(x, y X) R):
        $is_nonempty_set(X)
        not $is_metric_disconnected(X, dist)
  comments: "Status: checkable. The separation witness, disconnectedness, and connectedness predicates verified directly."

- source: "Tao, Analysis II, fourth edition, Definition 2.4.3"
  problem: "Define connected and disconnected subsets using the restricted ambient metric."
  proof_idea: "Treat the subset as its own carrier and restrict the distance function to pairs of subset elements."
  litex_code: |
    prop is_metric_connected_subset(X set, dist fn(x, y X) R, E power_set(X)):
        $is_metric_connected(E, fn(x, y E) R {dist(x, y)})
  comments: "Status: checkable. Both connected and disconnected subset predicates verified."

- source: "Tao, Analysis II, fourth edition, Theorem 2.4.5"
  problem: "For a nonempty real subset, characterize connectedness equivalently by containing every closed interval between its points and by being an interval."
  proof_idea: "A missing intermediate point separates the set at that point. Conversely, a hypothetical separation contradicts the supremum of one separated part inside a contained closed interval. The interval formulation is order-convexity."
  litex_code: |
    thm connected_real_subset_contains_intervals:
        # Full statement is in the chapter file.
        trust $contains_closed_intervals_between_points(E)
  comments: "Status: translated; blocker label: trust. Four reusable directions preserve the three source clauses. The supremum argument and the source-deferred interval equivalence remain trusted."

- source: "Tao, Analysis II, fourth edition, Theorem 2.4.6"
  problem: "Show that the image of a connected subset under a continuous map is connected."
  proof_idea: "If the image had a separation, pull both open pieces back under the continuous map to obtain a separation of the original connected subset."
  litex_code: |
    thm continuous_map_preserves_metric_connectedness:
        # Full statement is in the chapter file.
        trust $is_metric_connected_subset(Y, dist_Y, \function_image<X, Y, f, E>)
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.4.4; it also depends on the trusted open-inverse-image characterization."

- source: "Tao, Analysis II, fourth edition, Corollary 2.4.7"
  problem: "A continuous real-valued map on a connected subset attains every value between the images of two points."
  proof_idea: "The image is connected, hence an interval by Theorem 2.4.5, so every intermediate value belongs to the image and therefore has a domain preimage."
  litex_code: |
    thm intermediate_value_on_metric_connected_subset:
        # Full statement is in the chapter file.
        trust exist c E st {f(c) = y}
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 2.4.5. The between-values relation is concrete."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.1"
  problem: "Define a topology on a carrier by the empty-set, whole-space, finite-intersection, and arbitrary-union axioms."
  proof_idea: "Represent the topology as a supplied collection of subsets. Express a family of open sets through one reusable predicate, then apply Chapter 1's canonical set-family intersection and union constructions."
  litex_code: |
    prop is_topology_on(X set, T power_set(power_set(X))):
        {} $in T
        X $in T
        forall A finite_set, family fn(alpha A) power_set(X):
            $is_topological_open_family(X, T, A, family)
            =>:
                \chap1::set_family_intersection<X, A, family> $in T
        forall A set, family fn(alpha A) power_set(X):
            $is_topological_open_family(X, T, A, family)
            =>:
                \chap1::set_family_union<X, A, family> $in T
  comments: "Status: checkable. The concrete finite- and arbitrary-family formulation verified in the release session and final chapter gate on 2026-07-26."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.2"
  problem: "Define a neighborhood of a point in a topological space."
  proof_idea: "A source neighborhood is exactly an open member of the supplied topology that contains the point."
  litex_code: |
    prop is_topological_neighborhood(X set, T power_set(power_set(X)), x X, V power_set(X)):
        V $in T
        x $in V
  comments: "Status: checkable. The definition verified directly."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.4"
  problem: "Define convergence of a sequence to a point using all topological neighborhoods."
  proof_idea: "For each neighborhood of the candidate limit, choose a positive tail index after which every sequence value lies in that neighborhood."
  litex_code: |
    prop has_topological_limit(X set, T power_set(power_set(X)), u fn(n N_pos) X, a X):
        forall V power_set(X):
            $is_topological_neighborhood(X, T, a, V)
            =>:
                exist N0 N_pos st {$is_eventually_in_topological_neighborhood(X, u, V, N0)}
  comments: "Status: checkable. As elsewhere in this module, `N_pos` normalizes Tao's arbitrary starting index convention."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.5"
  problem: "Define topological interior, exterior, and boundary points of a subset."
  proof_idea: "An interior point has a neighborhood contained in the set; an exterior point has a neighborhood disjoint from it; a boundary point is neither."
  litex_code: |
    prop is_topological_boundary_point(X set, T power_set(power_set(X)), E power_set(X), x X):
        not $is_topological_interior_point(X, T, E, x)
        not $is_topological_exterior_point(X, T, E, x)
  comments: "Status: checkable. All three concrete point predicates verified together."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.6"
  problem: "Define adherent points, closure, and topologically closed subsets."
  proof_idea: "A point is adherent when every neighborhood meets the subset. Collect exactly those points into the canonical closure; call a subset closed when its complement is open."
  litex_code: |
    template<X set>:
        have fn topological_closure(T power_set(power_set(X)), E power_set(X)) power_set(X) = {x X: $is_topological_adherent_point(X, T, E, x)}

    prop is_topologically_closed(X set, T power_set(power_set(X)), E power_set(X)):
        set_minus(X, E) $in T
  comments: "Status: checkable. The closure is a callable set construction rather than an existential relation."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.7"
  problem: "Define the topology on a subset induced from an ambient topology."
  proof_idea: "A subset of the smaller carrier is relatively open exactly when it is the intersection of that carrier with an ambient open set."
  litex_code: |
    template<X set>:
        have fn relative_topology(T power_set(power_set(X)), Y power_set(X)) power_set(power_set(Y)) = {U power_set(Y): $has_relative_open_source(X, T, Y, U)}
  comments: "Status: checkable. The source leaves verification of the topology axioms as an exercise, which is excluded by the inventory policy."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.8"
  problem: "Define continuity at a point and global continuity between topological spaces."
  proof_idea: "Every neighborhood of the output value must contain the image of some neighborhood of the input point; global continuity quantifies this condition over all input points."
  litex_code: |
    prop is_topologically_continuous(X, Y set, T_X power_set(power_set(X)), T_Y power_set(power_set(Y)), f fn(x X) Y):
        forall a X:
            $is_topologically_continuous_at(X, Y, T_X, T_Y, f, a)
  comments: "Status: checkable. A separate witness predicate keeps the chosen input neighborhood and its pointwise image condition explicit."

- source: "Tao, Analysis II, fourth edition, Definition 2.5.9"
  problem: "Define compact topological spaces and compact subsets by finite subcovers, and retain the adjacent topological connectedness formulation."
  proof_idea: "An open cover is an indexed family of open sets whose union contains the carrier. Compactness selects a finite index subset still covering the carrier. Subset compactness and connectedness use the relative topology."
  litex_code: |
    prop is_topologically_compact(X set, T power_set(power_set(X))):
        forall A set, cover fn(alpha A) power_set(X):
            $is_topological_open_cover(X, T, A, cover)
            =>:
                $has_finite_topological_subcover(X, A, cover)

    prop is_topologically_compact_subset(X set, T power_set(power_set(X)), Y power_set(X)):
        $is_topologically_compact(Y, \relative_topology<X>(T, Y))
  comments: "Status: checkable. Open covers, finite subcovers, compact subsets, and the source's adjacent topological separation/connectedness notions all verified without trust."
