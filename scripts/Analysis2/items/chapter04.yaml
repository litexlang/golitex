  proof_idea: "Represent coefficients as a natural-indexed real function and sum coefficients times powers of the displacement."
  litex_code: "have fn power_series_term(coefficients fn(m N) R, center R, n N, x R) R = coefficients(n) * (x - center)^n"
  comments: "Status: checkable. Verified by the Chapter 4 release file gate."
