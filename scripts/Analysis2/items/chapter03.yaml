  comments: "Status: translated; blocker label: trust. Both implications are explicit and verified as declarations."

- source: "Tao, Analysis II, fourth edition, Theorem 3.4.5"
  problem: "Show bounded continuous functions into a complete metric space form a complete uniform-metric space."
  proof_idea: "A uniformly Cauchy family is pointwise Cauchy; choose pointwise limits using completeness, prove uniform convergence, then preserve continuity and boundedness."
  litex_code: |
    thm bounded_continuous_function_space_is_complete:
        # Full statement is in the chapter file.
        trust exist f \bounded_continuous_function_space<X, Y, dist_X, dist_Y> st {$is_uniformly_convergent_to(X, Y, dist_Y, family, f)}
  comments: "Status: translated; blocker label: trust. Tao assigns the proof to Exercise 3.4.3."

- source: "Tao, Analysis II, fourth edition, Definition 3.5.2"
  problem: "Define pointwise and uniform convergence of an infinite series of real-valued functions."
  proof_idea: "Build the finite partial-sum function and apply scalar metric convergence pointwise or one common tail bound uniformly."
  litex_code: |
    template<X set>:
        have fn function_partial_sum(family fn(n N_pos) fn(y X) R, k N_pos, x X) R = sum(1, k, fn(j N_pos) R {family(j)(x)})
  comments: "Status: checkable. Partial sums and both convergence relations pass the release verifier."

- source: "Tao, Analysis II, fourth edition, Definition 3.5.5"
  problem: "Define the sup norm of a bounded real-valued function."
  proof_idea: "Characterize the supremum of absolute values by an upper bound approached within every positive tolerance, with value zero on the empty domain."
  litex_code: |
    prop is_sup_norm_value(X set, f fn(x X) R, M R):
        forall x X: abs(f(x)) <= M
        forall epsilon R_pos: exist x X st {M - epsilon < abs(f(x))}
  comments: "Status: checkable as a candidate relation; the source's empty-domain convention is represented separately."

- source: "Tao, Analysis II, fourth edition, Theorem 3.5.7"
