- source: "Tao, Analysis II, fourth edition, Definition 3.3.5"
  problem: "Define a bounded function between metric spaces."
  proof_idea: "Require one codomain center and positive radius whose ball contains every function value."
  litex_code: |
    prop is_metric_bounded_function(X, Y set, dist_Y fn(x, y Y) R, f fn(x X) Y):
        exist y0 Y, radius R_pos st {$is_metric_function_bound(X, Y, dist_Y, f, y0, radius)}
  comments: "Status: checkable. The definition and its residual bound relation verified directly."

- source: "Tao, Analysis II, fourth edition, Proposition 3.3.6"
