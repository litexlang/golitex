- source: "Tao, Analysis II, fourth edition, Definition 3.1.1"
  problem: "Define the limiting value of a function on a subset as its argument approaches an adherent ambient point."
  proof_idea: "Expose the epsilon-delta control condition as a residual relation, require the approach point to be adherent to the domain subset, and quantify a positive radius for every positive output tolerance."
  litex_code: |
    prop has_function_limit(X, Y set, dist_X fn(x, y X) R, dist_Y fn(x, y Y) R, E power_set(X), f fn(x E) Y, x0 X, L Y):
        $chap1::is_metric_adherent_point(X, dist_X, E, x0)
        forall epsilon R_pos:
            exist delta R_pos st {$is_function_limit_delta_controlled(X, Y, dist_X, dist_Y, E, f, x0, L, epsilon, delta)}
  comments: "Status: checkable. The definition and its residual relation verified in the Chapter 3 release session on 2026-07-26. The relation deliberately retains Tao's convention that x0 itself is not removed from E."

- source: "Tao, Analysis II, fourth edition, Proposition 3.1.5"
  problem: "Characterize a function limit equivalently by sequences, open neighborhoods, and continuity of the extension assigning the limiting value at the approach point."
  proof_idea: "Translate epsilon-delta control to eventual control along every convergent domain sequence; translate balls to open neighborhoods; and compare with the piecewise extension at the approach point."
  litex_code: |
    thm function_limit_implies_sequential_form:
        # Full statement is in the chapter file.
        trust $preserves_sequences_at_function_limit(X, Y, dist_X, dist_Y, E, f, x0, L)
  comments: "Status: translated; blocker label: trust. Tao defers the proof to Exercise 3.1.2. Six reusable equivalence directions remain trusted. The value-at-domain-point consequence is checkable by applying the delta condition at x0. The extension is represented by an ambient map constrained exactly on E union {x0}, because direct dependent-union function construction failed during the session."

- source: "Tao, Analysis II, fourth edition, Definition 3.2.1"
  problem: "Define pointwise convergence of a sequence of functions."
  proof_idea: "At each fixed domain point, apply the Chapter 1 metric-limit relation to the resulting sequence of codomain values."
  litex_code: |
    prop is_pointwise_convergent_to(X, Y set, dist_Y fn(x, y Y) R, family fn(n N_pos) fn(x X) Y, f fn(x X) Y):
        forall x X:
            $chap1::has_metric_limit(Y, dist_Y, fn(n N_pos) Y {family(n)(x)}, f(x))
  comments: "Status: checkable. The function family is a typed sequence of callable maps."

- source: "Tao, Analysis II, fourth edition, Definition 3.2.7"
  problem: "Define uniform convergence of a sequence of functions."
  proof_idea: "For every positive tolerance choose one positive tail index controlling all later family members at every domain point."
  litex_code: |
    prop is_uniformly_convergent_to(X, Y set, dist_Y fn(x, y Y) R, family fn(n N_pos) fn(x X) Y, f fn(x X) Y):
        forall epsilon R_pos:
            exist N0 N_pos st {$is_uniform_function_tail_controlled(X, Y, dist_Y, family, f, epsilon, N0)}
  comments: "Status: checkable. The residual tail-control relation makes the quantifier-order distinction from pointwise convergence explicit."

- source: "Tao, Analysis II, fourth edition, Theorem 3.3.1"
