        trust $chap2::is_metric_continuous_at(X, Y, dist_X, dist_Y, f, x0)
  comments: "Status: translated; blocker label: trust. A full outermost try and a reduced delta-bridge try both ended in an unlocated ExecStmtError after spelling out the triangle estimates."

