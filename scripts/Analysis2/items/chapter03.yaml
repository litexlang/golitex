- source: "Tao, Analysis II, fourth edition, Proposition 3.3.3"
  problem: "Interchange an outer limit over uniformly convergent functions with their limiting values at an adherent point."
  proof_idea: "Use uniform closeness and the individual function limits to show their limiting values are Cauchy; completeness supplies the outer limit, and a second epsilon/3 estimate gives the limit of the uniform limit function."
  litex_code: |
    thm interchange_function_limits_and_uniform_limit:
        # The theorem concludes with a common value L for both iterated limits.
        trust exist L Y st {$chap1::has_metric_limit(Y, dist_Y, limits, L), $has_function_limit(X, Y, dist_X, dist_Y, E, f, x0, L)}
  comments: "Status: translated; blocker label: trust. Tao defers the proof to Exercise 3.3.2."

