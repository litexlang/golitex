- source: "Tao, Analysis II, fourth edition, Definition 3.4.2"
  problem: "Define the bounded-function space and its uniform metric."
  proof_idea: "Use a set-builder for bounded maps and characterize the supremum distance by upper-bound and arbitrary-approximation conditions; handle the empty domain separately."
  litex_code: |
    prop is_uniform_distance_value(X, Y set, dist_Y fn(x, y Y) R, f, g fn(x X) Y, D R):
        forall x X: dist_Y(f(x), g(x)) <= D
        forall epsilon R_pos: exist x X st {D - epsilon < dist_Y(f(x), g(x))}
  comments: "Status: translated; blocker label: trust. Unique existence of the supremum is trusted because a reusable real-supremum selector is unavailable."

- source: "Tao, Analysis II, fourth edition, Proposition 3.4.4"
